<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PROMESSA FC — Manutenção Programada</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261022">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon.png?v=20261022">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20261022">
  <meta name="theme-color" content="#040908">
  <style>
    @font-face { font-family: 'Teko'; font-weight: 700; src: url('fontes/teko-700.woff2') format('woff2'); }
    @font-face { font-family: 'Rajdhani'; font-weight: 600; src: url('fontes/rajdhani-600.woff2') format('woff2'); }
    @font-face { font-family: 'Rajdhani'; font-weight: 700; src: url('fontes/rajdhani-700.woff2') format('woff2'); }

    :root {
      --bg: #030806;
      --card-bg: rgba(7, 16, 12, 0.88);
      --verde: #00FF87;
      --ouro: #E8B84B;
      --linha: rgba(0, 255, 135, 0.28);
      --mut: rgba(242, 247, 244, 0.65);
      --fd: 'Teko', sans-serif;
      --fc: 'Rajdhani', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: #F2F7F4;
      font-family: var(--fc);
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      background: 
        radial-gradient(ellipse 70% 50% at 50% 15%, rgba(0, 255, 135, 0.12), transparent 70%),
        radial-gradient(ellipse 60% 50% at 50% 85%, rgba(232, 184, 75, 0.08), transparent 70%),
        linear-gradient(180deg, #020604 0%, #06120B 100%);
    }

    /* Grade geométrica de estádio ao fundo */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
    }

    /* Cartão Principal de Manutenção */
    .manut-card {
      position: relative;
      z-index: 10;
      width: min(520px, 94vw);
      background: var(--card-bg);
      border: 1px solid var(--linha);
      border-radius: 20px;
      padding: 42px 32px 34px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(0, 255, 135, 0.12);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      animation: cardEntra 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntra {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo oficial com halo pulsante */
    .logo-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
    }

    .logo-halo {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--verde), var(--ouro), transparent 60%, var(--verde));
      filter: blur(8px);
      opacity: 0.6;
      animation: giraHalo 6s linear infinite;
    }

    @keyframes giraHalo {
      to { transform: rotate(360deg); }
    }

    .logo-img {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: cover;
      border: 2px solid rgba(0, 255, 135, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    /* Badge de status com ponto pulsante */
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(232, 184, 75, 0.12);
      border: 1px solid rgba(232, 184, 75, 0.4);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ouro);
      margin-bottom: 14px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ouro);
      box-shadow: 0 0 10px var(--ouro);
      animation: pulso 1.4s ease-in-out infinite;
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.4; }
    }

    h1 {
      font-family: var(--fd);
      font-size: clamp(34px, 5vw, 46px);
      line-height: 0.95;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 10px;
    }

    h1 span {
      color: var(--verde);
    }

    p.desc {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--mut);
      margin-bottom: 24px;
      max-width: 440px;
      margin-inline: auto;
    }

    /* Caixa de Previsão */
    .box-info {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-item small {
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .info-item b {
      font-family: var(--fd);
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--verde);
      text-transform: uppercase;
    }

    /* Botão de Verificação Manual */
    .btn-verificar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, var(--verde), #059669);
      color: #03140b;
      border: none;
      font-family: var(--fc);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 255, 135, 0.3);
      transition: transform 0.15s, filter 0.15s;
    }

    .btn-verificar:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .auto-check {
      margin-top: 14px;
      font-size: 11.5px;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.4);
    }

    .auto-check b {
      color: var(--ouro);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <main class="manut-card">
    <div class="logo-wrap">
      <div class="logo-halo"></div>
      <img class="logo-img" src="assets/logo_goat_oficial.jpg" alt="Promessa FC">
    </div>

    <div class="badge-status">
      <span class="pulse-dot"></span>
      <span id="badgeTexto">Servidores em Atualização</span>
    </div>

    <h1 id="titManut">PROMESSA FC<br><span>MANUTENÇÃO PROGRAMADA</span></h1>

    <p class="desc" id="msgManut">
      Estamos aplicando novos conteúdos, balanceamento e melhorias no jogo. Seus dados e cartas continuam 100% seguros e preservados.
    </p>

    <div class="box-info">
      <div class="info-item">
        <small>Status</small>
        <b>Atualizando</b>
      </div>
      <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1)"></div>
      <div class="info-item">
        <small>Previsão</small>
        <b id="prevTexto">Voltamos em breve</b>
      </div>
    </div>

    <button class="btn-verificar" id="btVerificar" onclick="verificarAgora()">
      Verificar se voltou
    </button>

    <div class="auto-check">
      Verificando servidores automaticamente em <b id="timerCheck">8s</b>...
    </div>
  </main>

  <script>
    var seg = 8;
    var timerEl = document.getElementById('timerCheck');

    function checarStatus() {
      fetch('/dados/manutencao.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data) {
            if (data.titulo) document.getElementById('titManut').innerHTML = 'PROMESSA FC<br><span>' + data.titulo + '</span>';
            if (data.mensagem) document.getElementById('msgManut').textContent = data.mensagem;
            if (data.previsao) document.getElementById('prevTexto').textContent = data.previsao;

            // Se a manutenção foi desativada no editor, volta imediatamente ao jogo!
            if (data.ativa === false) {
              document.getElementById('badgeTexto').textContent = 'Servidores Liberados!';
              document.getElementById('titManut').innerHTML = 'PROMESSA FC<br><span style="color:#00FF87">ONLINE NOVAMENTE!</span>';
              document.getElementById('msgManut').textContent = 'A manutenção foi concluída! Redirecionando para o jogo...';
              setTimeout(function() {
                location.replace('/');
              }, 1200);
            }
          }
        })
        .catch(function() {});
    }

    function verificarAgora() {
      var bt = document.getElementById('btVerificar');
      bt.textContent = 'Verificando...';
      bt.disabled = true;
      checarStatus();
      setTimeout(function() {
        bt.textContent = 'Verificar se voltou';
        bt.disabled = false;
      }, 1000);
    }

    // Cronômetro regressivo de auto-verificação
    setInterval(function() {
      seg--;
      if (seg <= 0) {
        seg = 8;
        checarStatus();
      }
      if (timerEl) timerEl.textContent = seg + 's';
    }, 1000);

    checarStatus();
  </script>
</body>
</html>
