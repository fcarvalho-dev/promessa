const G = 'var(--accent)';
const AMBER = 'var(--accent2)';
const WHITE = '#ffffff';

const logo = (name) => {
  const __sl = (typeof window !== 'undefined' && window.__promessaSlugs) || null;
  const file = (__sl && __sl[name]) || String(name || '').toLowerCase().trim()
    .replace(/ /g, '_').replace(/-/g, '_')
    .replace(/[áàâãä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i')
    .replace(/[óòôõö]/g, 'o').replace(/[úùûü]/g, 'u').replace(/[ç]/g, 'c');
  const res = (typeof window !== 'undefined' && window.__resources) || {};


  return res['esc_' + file] || `assets/escudos/${file}.png`;
};

// bandeira: se o png da nacionalidade não existir, mostra um placeholder neutro
// (nunca um ícone de imagem quebrada)
if (typeof window !== 'undefined') {
  window.futxFlagFb = function (img) {
    img.onerror = null;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22"><rect width="32" height="22" fill="#132018"/><rect width="32" height="7.3" fill="var(--accent-dim)"/><rect y="14.7" width="32" height="7.3" fill="#0d1712"/><circle cx="16" cy="11" r="3.4" fill="none" stroke="var(--accent-dim)" stroke-width="1.3"/></svg>');
  };
}

// logo da competicao (mapeia nome do torneio -> arte em assets/leagues)
const COMP_SLUG = [
  [/série a|serie a|brasileir/i, 'serie_a'], [/série b/i, 'serie_b'], [/série c/i, 'serie_c'], [/série d/i, 'serie_d'],
  [/copa do brasil/i, 'cdb'], [/libertadores/i, 'lib'], [/sul-?americana/i, 'sul'],
  [/champions/i, 'ucl'], [/europa league/i, 'uel'], [/mundial de clubes|copa do mundo/i, 'mun'],
  [/premier league|fa cup/i, 'eng'], [/championship/i, 'eng2'],
  [/la liga|copa del rey/i, 'esp'], [/serie a.*it|coppa/i, 'ita'],
  [/bundesliga|pokal/i, 'ger'], [/ligue 1|coupe/i, 'fra'],
  [/portugal|taça/i, 'por'], [/eredivisie|knvb/i, 'ned'],

/* Nome da conquista -> arquivo de TAÇA no acervo. A ordem importa:
   "Copa do Brasil" tem que casar antes de "brasileir", senão a copa
   ganharia o troféu do Brasileirão. */
const TACA_POR_NOME = [
  [/copa do brasil/i, 'tr_copa_BRA'],
  [/supercopa rei/i, 'tr_supercopa_BRA'],
  [/copa do nordeste/i, 'tr_copanordeste'], [/copa verde/i, 'tr_copaverde'],
  [/recopa sul-?americana/i, 'tr_recopasulamaericana'],
  [/série a|serie a|brasileirão série a/i, 'tr_nacional_BRA_d1'],

  [/série c|serie c/i, 'tr_nacional_BRA_d3'],
  [/série d|serie d/i, 'tr_nacional_BRA_d4'],
  [/libertadores/i, 'tr_libertadores'], [/sul-?americana/i, 'tr_sulamericana'],
  [/champions league/i, 'tr_ligacampeoes'], [/europa league|liga europa/i, 'tr_ligaeuropa'],
  [/conference/i, 'tr_conference'],
  [/concacaf/i, 'tr_ligaconcacaf'], [/afc champions/i, 'tr_ligaafc'],
  [/caf champions/i, 'tr_ligacaf'], [/ofc champions/i, 'tr_ligaofc'],
  [/mundial de clubes/i, 'tr_mundial'], [/copa do mundo/i, 'tr_copamundo'],
  [/copa américa|copa america/i, 'tr_copaamerica'], [/eurocopa/i, 'tr_eurocopa'],
  [/copa ouro|gold cup/i, 'tr_copaouro'], [/copa da ásia|copa asia/i, 'tr_copaasia'],
  [/copa africa|copa áfrica/i, 'tr_copaafrica'], [/liga das nações/i, 'tr_liganacoes'],
  [/fa cup/i, 'tr_copa_ING'], [/premier league|championship/i, 'tr_nacional_ING'],
  [/copa del rey/i, 'tr_copa_ESP'], [/la liga/i, 'tr_nacional_ESP'],
  [/coppa italia/i, 'tr_copa_ITA'], [/serie a.*it/i, 'tr_nacional_ITA'],
  [/dfb-?pokal/i, 'tr_copa_ALE'], [/bundesliga/i, 'tr_nacional_ALE'],
  [/coupe de france/i, 'tr_copa_FRA'], [/ligue 1/i, 'tr_nacional_FRA'],
  [/copa argentina/i, 'tr_copa_ARG'], [/argentin|liga profesional/i, 'tr_nacional_ARG'],
  [/taça de portugal|portugal/i, 'tr_nacional_POR'],
  [/knvb|eredivisie/i, 'tr_nacional_HOL'],
  [/campeonato (paulista|carioca|mineiro|gaúcho|gaucho|baiano|pernambucano|cearense|paranaense|catarinense|goiano)/i, 'tr_estadualgenerico'],
];
/* A TAÇA da conquista, não o escudo da liga — a vitrine é sobre o que
   você levantou. E se nada casar, o genérico do tipo certo em vez de
   uma imagem que não carrega. */
const compLogo = (nome) => {
  const n = String(nome || '');
  for (let i = 0; i < TACA_POR_NOME.length; i++) {
    if (TACA_POR_NOME[i][0].test(n)) return 'trofeus/' + TACA_POR_NOME[i][1] + '.png';
  }
  if (/copa|cup|taça/i.test(n)) return 'trofeus/tr_copa.png';
  if (/liga|campeonato|série|serie/i.test(n)) return 'trofeus/tr_nacionalgenerico.png';
  return 'icones/trofeu.svg';
};

// fallback de demonstração (usado apenas se não houver carreira salva)
const DEMO_SEASONS = [
  ['2026', 'Flamengo', 'A', 38, 12, 9, '7.12', 74, '—'],
];

const chaveDaBandeira = (n) => {
  if (n && typeof n === 'object') n = n.key || n.slug || n.nome || n.label || n.flag;
  return String(n || 'brasil').toLowerCase();
};

#apx .graf .pt b{font:600 14px/1 var(--ft)}
#apx .graf .pt small{font-size:9.5px;color:var(--dim2)}
#apx .graf .pt.auge b{color:var(--n)}
#apx .seg{display:flex;gap:4px;flex-wrap:wrap}
#apx .seg button{height:24px;padding:0 9px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);border:1px solid var(--ln)}
#apx .seg button[aria-pressed="true"]{background:var(--n);color:#04110A;border-color:transparent}
#apx /* clubes */
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
#apx .cl{display:grid;gap:8px;padding:12px;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-top:3px solid var(--cc,var(--n))}
#apx .cl .cab2{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
#apx .cl .cab2 img,#apx .cl .cab2 .ini{width:52px;height:52px;object-fit:contain}
#apx .cl b.nm{display:block;font:600 24px/1 var(--ft);text-transform:uppercase}
#apx .cl small{color:var(--dim);font-size:12px}
#apx .cl .tag{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding:2px 7px;border:1px solid rgba(var(--n-rgb),.5);color:var(--n);white-space:nowrap}
#apx .cl .ln{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
#apx .cl .ln b{display:block;font:600 22px/1 var(--ft)}
#apx .cl .ln span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
#apx .cl .tr{display:flex;gap:4px;flex-wrap:wrap}
#apx .cl .tr img{width:26px;height:26px;object-fit:contain}
#apx .caminho{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0 12px}
#apx .caminho .p{display:grid;justify-items:center;gap:2px}
#apx .caminho .p img,#apx .caminho .p .ini{width:40px;height:40px}
#apx .caminho .p small{font-size:10.5px;color:var(--dim)}
#apx .caminho i{font-style:normal;color:var(--n);font:700 20px/1 var(--ft)}
#apx /* troféus */
.estante{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
#apx .taca{position:relative;display:grid;justify-items:center;gap:4px;padding:12px 6px 9px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.3));border:1px solid var(--ln);text-align:center}
#apx .taca img{height:74px;width:auto;max-width:92px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65))}
#apx .taca b{font:600 16px/1 var(--ft);text-transform:uppercase}
#apx .taca small{font-size:10.5px;color:var(--dim)}
#apx .taca em{position:absolute;top:6px;right:7px;font:700 18px/1 var(--ft);font-style:normal;color:var(--ouro)}
#apx .premio{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
#apx .premio img{width:38px;height:38px;object-fit:contain}
#apx .premio b{font:600 19px/1 var(--ft);text-transform:uppercase}
#apx .premio small{display:block;color:var(--dim);font-size:12px}
#apx .premio span{font:600 19px/1 var(--ft);color:var(--ouro)}
#apx /* atributos */
.atr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
#apx .atr div{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:2px 8px;align-items:center}
#apx .atr span{font-size:12px;color:var(--dim)}
#apx .atr b{font:600 19px/1 var(--ft);text-align:right}
#apx .atr i{grid-column:1/-1;display:block;height:5px;background:rgba(255,255,255,.08)}
#apx .atr i s{display:block;height:100%;background:var(--n);text-decoration:none}
#apx /* grades das telas */
.t-resumo{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
#apx .t-resumo .r1{grid-row:1/3}
#apx .t-temp{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
#apx .t-clubes,#apx .t-taca,#apx .t-sel{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
#apx .t-taca .lado,#apx .t-sel .lado{display:grid;gap:12px;grid-template-rows:minmax(0,1fr) minmax(0,1fr);min-height:0}
@media (max-width:1100px){#apx .app{display:flex;flex-direction:column;gap:10px;padding:12px 16px}
#apx .app>*{min-width:0}
#apx .dir{order:1;flex:1;min-height:0}
#apx .dir:not(:has(.tela)){flex:none}
#apx .carta{order:2}
#apx .carta.m-on{flex:1}
#apx .sub{white-space:normal}
#apx .cab{flex-direction:column;align-items:stretch;gap:10px}
#apx .bts .cta{flex:1;height:40px;font-size:18px}
#apx .tit{font-size:38px}
#apx .sub{font-size:13px}
#apx .carta{display:none}
#apx .carta.m-on{display:flex}
#apx .abas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#apx .abas button{flex:none}
#apx .tela{display:flex;flex-direction:column;overflow:auto}
#apx .tela>*{flex:none;min-height:240px}
#apx .t-taca .lado,#apx .t-sel .lado{display:flex;flex-direction:column}

}

#apx{position:fixed;inset:0;z-index:9600;overflow:hidden}
#apx .fundo{position:absolute}

        ? { label: 'Defesas', value: S.reduce((s, x) => s + (x[13] || 0), 0), color: AMBER }
        : { label: 'Gols', value: totalGoals, color: AMBER },
      posT === 'GOL'
        ? { label: 'Clean Sheets', value: S.reduce((s, x) => s + (x[16] || 0), 0), color: WHITE }
        : { label: 'Assistências', value: totalAssists, color: WHITE },
      { label: 'Nota Média', value: careerAvg, color: G },
      { label: 'Pico de OVR', value: peak, color: AMBER },
      { label: 'Cartões Amarelos', value: totYellow, color: '#f5c518' },
      { label: 'Cartões Vermelhos', value: totRed, color: '#FF5A5A' },
      { label: 'Lesões', value: totInj, color: totInj > 8 ? '#FF5A5A' : WHITE },
    ];

    const byName = {};
    titlesAll.forEach(t => { (byName[t.name] = byName[t.name] || []).push(t.year); });
    const valTitles = Object.keys(byName).map(name => ({
      name, count: byName[name].length, years: byName[name].join(' · '),
    }));

    const gold = { color: AMBER, border: 'rgba(var(--accent2-rgb), 0.35)', bg: 'rgba(var(--accent2-rgb), 0.1)' };
    const silver = { color: 'rgba(255,255,255,0.75)', border: 'rgba(255,255,255,0.2)', bg: 'rgba(255,255,255,0.05)' };
    const byAward = {};
    awardsAll.forEach(a => { const k = a.icon + '|' + a.name + '|' + a.tier; (byAward[k] = byAward[k] || []).push(a.year); });
    const valAwards = Object.keys(byAward).map(k => {
      const parts = k.split('|');
      return Object.assign({ icon: parts[0], name: parts[1], count: byAward[k].length, years: byAward[k].join(' · ') },
        parts[2] === 'gold' ? gold : silver);
    });

    const best = S.slice().sort((a, b) => parseFloat(b[6]) - parseFloat(a[6]))[0];
    const clubGames = {};
    S.forEach(s => { clubGames[s[1]] = (clubGames[s[1]] || 0) + s[3]; });
    const heartClub = Object.keys(clubGames).sort((a, b) => clubGames[b] - clubGames[a])[0];
    const peakSeason = S.find(s => s[7] === peak);
    const valRecords = [
      { label: 'Melhor Temporada', value: best[0] + ' — nota ' + best[6], sub: best[8] !== '—' ? best[8] : best[1] + ' · Série ' + best[2] },
      { label: 'Clube do Coração', value: heartClub, sub: clubGames[heartClub] + ' jogos pelo clube' },
      { label: 'Auge da Carreira', value: peak + ' OVR', sub: peakSeason ? 'temporada ' + peakSeason[0] + ' · ' + peakSeason[1] : '' },
    ];

    const titleCount = titlesAll.length;

    // ---------- RANQUE DE CARREIRA ----------
    // Pontua a carreira inteira e devolve um titulo — de bagre a GOAT.
    // Escala variavel: o simulador permite carreiras muito diferentes.
    const _nomes = titlesAll.map(function (t) { return String(t.name || ''); });
    const _tem = function (re) { return _nomes.some(function (n) { return re.test(n); }); };
    const _conta = function (re) { return _nomes.filter(function (n) { return re.test(n); }).length; };

    const _mundiais   = _conta(/copa do mundo|mundial de clubes/i);
    const _uclLib     = _conta(/champions|libertadores/i);
    const _ligas      = _conta(/série a|serie a|premier league|la liga|bundesliga|ligue 1|liga portugal|eredivisie/i);
    const _premios    = (awardsAll || []).length;
    const _temporadas = S.length;
    const _mediaGols  = _temporadas ? (totalGoals / _temporadas) : 0;

    let _score = 0;
    _score += titleCount * 7;
    _score += _mundiais * 25;
    _score += _uclLib * 16;
    _score += _ligas * 7;
    _score += _premios * 6;
    _score += Math.max(0, peak - 70) * 1.6;
    _score += Math.min(8, _temporadas * 0.5);      // longevidade ajuda pouco
    _score += Math.min(6, totalMatches / 90);      // so jogar nao faz lenda
    _score += Math.min(6, _mediaGols * 0.5);
    if (titleCount > 0) _score += 6;               // ser campeao ja muda o patamar

    // carreira curta demais nao vira lenda, por melhor que tenha sido
    if (_temporadas <= 2) _score *= 0.55;
    else if (_temporadas === 3) _score *= 0.72;    // carreira curta pesa, mas nao apaga o feito

    const _RANQUE = [
      [215, 'O GOAT',              'ganhou tudo o que existia para ganhar'],
      [170, 'IMORTAL',             'nome eternizado no futebol mundial'],
      [135, 'LENDA VIVA',          'gerações vão contar suas histórias'],
      [105, 'ASTRO INTERNACIONAL', 'brilhou longe de casa e conquistou o mundo'],
      [ 80, 'ÍDOLO DA NAÇÃO',      'camisa pesada, torcida na palma da mão'],
      [ 60, 'CRAQUE DO CLUBE',     'quem mandava em campo era você'],
      [ 44, 'XODÓ DA TORCIDA',     'nem sempre decisivo, mas sempre amado'],
      [ 31, 'TITULAR CATIVO',      'nome garantido na escalação'],
      [ 20, 'JOGADOR DE GRUPO',    'cumpriu seu papel sem holofote'],
      [ 12, 'RESERVA DE LUXO',     'entrava e resolvia… às vezes'],
      [  6, 'FIGURINHA CARIMBADA', 'esteve lá, e já é alguma coisa'],
      [  2, 'PERNA DE PAU',        'a bola nunca foi muito sua amiga'],
      [ -1, 'BAGRE ASSUMIDO',      'uma carreira para esquecer — mas ninguém esquece'],
    ];
    let _tier = _RANQUE[_RANQUE.length - 1];
    for (let _i = 0; _i < _RANQUE.length; _i++) { if (_score >= _RANQUE[_i][0]) { _tier = _RANQUE[_i]; break; } }
    const tierBase = _tier[1];
    const valTierDesc = _tier[2];
    const valCareerScore = Math.round(_score);
    const valTierLabel = (_score >= 60 ? '★ ' + tierBase + ' ★' : tierBase);

    return {
      valFlagUrl: 'flags/' + chaveDaBandeira(this.prop('nacionalidade', 'brasil')) + '.png',
      valDisplayName: (nome + ' ' + sobrenome).trim().toUpperCase(),
      valShirtName: (sobrenome || nome).toUpperCase(),
      valPosition: posicao,
      valPeakOverall: peak,
      valCareerSpan: S[0][0] + '–' + S[S.length - 1][0],
      valSeasonsCount: S.length,
      valTierLabel, valTierDesc, valCareerScore,
      // ---- vitrine de trofeus: um escudo por conquista, em ordem cronologica ----
      valTrophyCase: (function () {
        const arr = (titlesAll || []).slice().sort(function (a, b) { return (a.year || 0) - (b.year || 0); });
        return arr.map(function (t) {
          return {
            comp: t.name,
            year: String(t.year || ''),
            compLogo: compLogo(t.name),
            clubLogo: t.team ? logo(t.team) : '',
            hasClub: !!t.team,
            tip: t.name + (t.team ? ' · ' + t.team : '') + (t.year ? ' · ' + t.year : ''),
          };
        });
      })(),
      hasTrophyCase: (titlesAll || []).length > 0,
      // sem troféus o card nao precisa do espaco extra
      valTopSpacer: (titlesAll || []).length > 0 ? '92px' : '26px',
      trophyCount: (titlesAll || []).length + ((titlesAll || []).length === 1 ? ' CONQUISTA' : ' CONQUISTAS'),
      valHeartClubLogo: logo(heartClub),
      valTotalMatches: totalMatches,
      valTotalGoals: totalGoals,
      valTotalTitles: titleCount,
      ...(() => {
        // séries por stat (índices do histórico)
        const posP = this.prop('posicao', 'MEI');
        const statDefs = [
          ['ovr', 'OVERALL', s => s[7]],
          ['nota', 'NOTA MÉDIA', s => parseFloat(s[6])],
          ['gols', 'GOLS', s => s[4]],
          ['assist', 'ASSISTÊNCIAS', s => s[5]],
          ['desarmes', 'DESARMES', s => s[12] || 0],
          ['dribles', 'DRIBLES', s => s[15] || 0],
          ['defesas', 'DEFESAS', s => s[13] || 0],
          ['cleansheets', 'CLEAN SHEETS', s => s[16] || 0],
        ].filter(([key]) => {
          if (posP === 'GOL') return !['gols', 'dribles', 'desarmes'].includes(key) || key === 'ovr';
          return !['defesas', 'cleansheets'].includes(key);
        });
        const active = this.state.chartStat || 'ovr';
        const def = statDefs.find(x => x[0] === active) || statDefs[0];
        const series = S.map(def[2]);
        if (def[0] === 'ovr') for (let i = 0; i < series.length; i++) if (!(Number(series[i]) > 0)) series[i] = i ? series[i - 1] : (Number(series[i + 1]) || 0);
        const vmax = Math.max.apply(null, series), vmin = Math.min.apply(null, series);
        const range = (vmax - vmin) || 1;
        const n = series.length;
        const pts = series.map((v, i) => {
          const x = n === 1 ? 50 : (i / (n - 1)) * 100;
          const y = vmax === vmin ? 50 : 92 - ((v - vmin) / range) * 78;
          return { x, y, v };
        });
        const bestIdx = series.indexOf(vmax);
        return {
          valChartFilters: statDefs.map(([key, label]) => ({
            label,
            click: () => this.setState({ chartStat: key }),
            bg: active === key ? 'rgba(var(--accent2-rgb), 0.12)' : 'transparent',
            border: active === key ? 'rgba(var(--accent2-rgb), 0.4)' : 'rgba(255,255,255,0.08)',
            color: active === key ? 'var(--accent2)' : 'rgba(255,255,255,0.55)',
          })),
          valChartLine: pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' '),
          valChartArea: '0,100 ' + pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') + ' 100,100',
          valChartPts: pts.map((p, i) => ({
            left: p.x.toFixed(1) + '%',
            top: p.y.toFixed(1) + '%',
            logo: logo(S[i][1]),
            year: S[i][0],
            val: def[0] === 'nota' ? p.v.toFixed(2) : String(p.v),
            isBest: i === bestIdx,
            ring: i === bestIdx ? '2px solid var(--accent2)' : '1px solid rgba(255,255,255,0.25)',
            glow: i === bestIdx ? '0 0 16px rgba(var(--accent2-rgb), 0.6)' : 'none',
            tag: i === bestIdx ? 'AUGE' : '',
          })),
          valChartLabel: def[1],
          valChartMax: def[0] === 'nota' ? vmax.toFixed(2) : String(vmax),
          valChartMin: def[0] === 'nota' ? vmin.toFixed(2) : String(vmin),
        };
      })(),
      valTotals, valTitles, valAwards, valRecords, valSeasons,
      backToMenuClick: () => { if (_backMenu) _backMenu(); },
      clickNovaCarreira: () => {
        try { localStorage.removeItem('futx-carreira'); } catch (e) { console.warn('[aposentadoria] limpar carreira:', e); }
        if (this.props && this.props.onNovaCarreira) this.props.onNovaCarreira();
      },
    };
  }
}

</script>
