    </div>

</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;fase&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;auto&quot;, &quot;options&quot;: [&quot;auto&quot;, &quot;inicio&quot;, &quot;carreira&quot;, &quot;aposentadoria&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot;}}">
class Component extends DCLogic {
  state = {
    fase: 'inicio',
    contrato: (() => {
      try { return JSON.parse((typeof localStorage !== 'undefined' && localStorage.getItem('futx-fluxo-contrato')) || 'null'); }
      catch (e) { return null; }
    })()
  };

  irPara(fase, contrato) {
    const next = { fase };
    if (contrato !== undefined) next.contrato = contrato;
    this.setState(next);
    try {
      localStorage.setItem('futx-fluxo-fase', fase);
      if (contrato !== undefined) {
        if (contrato) localStorage.setItem('futx-fluxo-contrato', JSON.stringify(contrato));
        else localStorage.removeItem('futx-fluxo-contrato');
      }
    } catch (e) {}
  }

  componentDidMount() { this.__syncTheme(); }
  componentDidUpdate() { this.__syncTheme(); }
  __syncTheme() {
    try {
      const c = this.state.contrato || {};
      if (window.PC_applyTheme) window.PC_applyTheme(c.time || null);
    } catch (e) { console.warn('[tema]', e); }
  }

  renderVals() {
    const forced = this.props.fase;
    const fase = (forced && forced !== 'auto') ? forced : this.state.fase;
    const c = this.state.contrato || {};
    return {
      faseInicio: fase === 'inicio',
      faseCarreira: fase === 'carreira',
      faseAposentadoria: fase === 'aposentadoria',
      contratoAssinado: (dados) => {
        if (dados && !dados.saveId) {
          try {
            const A = window.PromessaArquivo;
            if (A) A.guardarAtiva();                              // lê a ativa síncrono antes do remove
            localStorage.removeItem('futx-carreira');
          } catch (e) { console.error('[saves] contrato novo:', e); }
        }
        this.irPara('carreira', dados);
      },
      aposentar: () => this.irPara('aposentadoria'),
      novaCarreira: () => this.irPara('inicio', null),
      voltarMenu: () => this.irPara('inicio'),   // volta ao menu SEM apagar a carreira
      continuar: () => this.irPara('carreira'),
      apagarSave: () => this.irPara('inicio', null),
      temSave: !!(this.state.contrato && this.state.contrato.nome),
      cContrato: this.state.contrato || null,
      cTime: c.time || null,
      cModo: c.modo || 'jogador',
      cDivisao: c.divisao || null,
      cSalario: c.salario != null ? c.salario : null,
      cNacionalidade: c.nacionalidade || null,
      cApelido: c.apelido || null,
      cAltura: c.altura != null ? c.altura : null,
      cPeso: c.peso != null ? c.peso : null,
      cPeFraco: c.peFraco != null ? c.peFraco : null,
      cEstilo: c.estilo || null,
      cCaracteristicas: c.caracteristicas || [],
      cAtributos: c.atributos || null,
      cNome: c.nome || null,
      cSobrenome: c.sobrenome || null,
      cCamisa: c.camisa != null ? c.camisa : null,
      cPosicao: c.posicao || null,
      cOverall: c.overall != null ? c.overall : null
    };
  }
}
</script>

<style>
#fxErr{position:fixed;inset:0;z-index:99999;background:rgba(4,8,6,.86);backdrop-filter:blur(4px);

#fxLeve{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99998;display:flex;gap:8px;
  align-items:center;max-width:min(560px,92vw);background:#1b1408;border:1px solid var(--c-ambar);color:#ffd9a3;
  border-radius:11px;padding:9px 12px;font:12.5px/1.4 Montserrat,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#fxLeve button{background:transparent;border:1px solid #6b4a12;color:#ffd9a3;border-radius:7px;padding:4px 9px;
  cursor:pointer;font:inherit;font-size:11px}

<script>
(function () {
  var box = document.getElementById('fxErr'), msg = document.getElementById('fxErrMsg'), ja = false;
  function salvarAgora() {
    /* Tenta guardar a carreira que estiver em memoria antes de qualquer
       coisa. Se o proprio salvar falhar, nao adianta insistir. */
    try {
      var raw = localStorage.getItem('futx-carreira');
      if (raw) localStorage.setItem('futx-carreira', raw);   // toca no valor: confirma que da para gravar
    } catch (e) {}
  }
  function mostrar(texto) {
    try { window.PromessaArquivo && window.PromessaArquivo.erro(texto); } catch (e) {}
    if (ja) return; ja = true;
    salvarAgora();
    msg.textContent = texto;
    box.hidden = false;
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window) return;   // 404 de imagem nao e travada
    mostrar((e.message || 'erro') + '\n' + ((e.filename || '') + ':' + (e.lineno || '?')) +
            '\n' + ((e.error && e.error.stack) || '').split('\n').slice(0, 6).join('\n'));
  });
  /* Promessa rejeitada NAO quebra a renderizacao — quem quebra e a
     excecao sincrona, tratada acima. Tomar a tela inteira por causa de um
     fetch ou de um close() de audio seria a rede virando o problema.
     Aqui vai uma barra discreta, com o detalhe a um clique. */
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    leve('promessa rejeitada: ' + ((r && (r.stack || r.message)) || r));
  });
  function leve(texto) {
    salvarAgora();
    var bar = document.getElementById('fxLeve');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'fxLeve';
      bar.innerHTML = '<span></span><button>detalhes</button><button>&times;</button>';
      document.body.appendChild(bar);
      bar.children[1].onclick = function () { mostrar(bar.__txt || ''); };
      bar.children[2].onclick = function () { bar.remove(); };
    }
    bar.__txt = texto;
    bar.children[0].textContent = 'Algo falhou em segundo plano. Sua carreira está salva.';
  }
  document.getElementById('fxErrRe').onclick = function () { location.reload(); };
  document.getElementById('fxErrIg').onclick = function () { box.hidden = true; ja = false; };
  document.getElementById('fxErrCp').onclick = function () {
    var t = msg.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
    else { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
           try { document.execCommand('copy'); } catch (e) {} a.remove(); }
    this.textContent = 'copiado';
  };
})();
</script>

    function recalcularFisico() {
      const elAlt = document.getElementById('slider-alt');
      const elPes = document.getElementById('slider-pes');
      if (!elAlt || !elPes) return;
      const alt = parseInt(elAlt.value, 10);
      const pes = parseInt(elPes.value, 10);

      estado.altura = alt;
      estado.peso = pes;

      const elValAlt = document.getElementById('txt-val-alt');
      if (elValAlt) elValAlt.innerText = `${(alt / 100).toFixed(2).replace('.', ',')} m`;
      const elValPes = document.getElementById('txt-val-pes');
      if (elValPes) elValPes.innerText = `${pes} kg`;

      const deltaAlt = alt - 175;
      const deltaPes = pes - 70;

      const mod = {
        ritmo: Math.round((-0.18 * deltaAlt) + (-0.14 * deltaPes)),
        agilidade: Math.round((-0.24 * deltaAlt) + (-0.22 * deltaPes)),
        forca: Math.round((+0.12 * deltaAlt) + (+0.30 * deltaPes)),
        salto: Math.round((+0.05 * deltaAlt) + (-0.32 * deltaPes)),
        cabeceio: Math.round((+0.25 * deltaAlt) + (+0.08 * deltaPes)),
        folego: Math.round((-0.04 * deltaAlt) + (-0.12 * deltaPes))
      };

      estado.modFisico = mod;

      let descEstatura = 'Médio';
      if (alt <= 168) descEstatura = 'Baixo';
      else if (alt >= 188) descEstatura = 'Muito Alto';
      else if (alt >= 182) descEstatura = 'Alto';

      const alturaM = alt / 100;
      const imc = pes / (alturaM * alturaM);

      let descPorte = 'Equilibrado';
      if (imc < 21.0) descPorte = 'Leve';
      else if (imc >= 26.5) descPorte = 'Troncudo';
      else if (imc >= 24.0) descPorte = 'Musculoso';

      let rotulo = `${descEstatura} ${descPorte}`;
      let tagResumo = '';

      if (alt >= 195 && imc >= 25.0) {
        rotulo = 'Muralha Colossal';
        tagResumo = 'Domínio Físico Bruto';
      } else if (alt >= 192 && imc < 22.0) {
        rotulo = 'Gigante Longilíneo';
        tagResumo = 'Envergadura & Alcance Aéreo';
      } else if (alt <= 170 && imc <= 22.0) {
        rotulo = 'Pequeno & Relâmpago';
        tagResumo = 'Agilidade Máxima & Aceleração';
      } else if (alt <= 172 && imc >= 26.5) {
        rotulo = 'Baixo & Tanque';
        tagResumo = 'Centro de Gravidade & Proteção';
      } else if (descPorte === 'Leve') {
        rotulo = `${descEstatura} & Ágil`;
        tagResumo = 'Impulsão Leve & Velocidade';
      } else if (descPorte === 'Troncudo') {
        rotulo = `${descEstatura} & Robusto`;
        tagResumo = 'Força no Contato & Proteção';
      } else if (descPorte === 'Musculoso') {
        rotulo = `${descEstatura} & Potente`;
        tagResumo = 'Impulso & Força Muscular';
      } else {
        rotulo = `${descEstatura} Balanceado`;
        tagResumo = 'Equilíbrio Geral & Fôlego';
      }

      const tagSalto = mod.salto >= 0 
        ? `<span class="impacto-item impacto-pos">+Impulsão (+${mod.salto})</span>` 
        : `<span class="impacto-item impacto-neg">-Impulsão (${mod.salto})</span>`;

      const tagForca = mod.forca >= 0 
        ? `<span class="impacto-item impacto-pos">+Força (+${mod.forca})</span>` 
        : `<span class="impacto-item impacto-neg">-Força (${mod.forca})</span>`;

      const tagRitmo = mod.ritmo >= 0 
        ? `<span class="impacto-item impacto-pos">+Aceleração (+${mod.ritmo})</span>` 
        : `<span class="impacto-item impacto-neg">-Velocidade (${mod.ritmo})</span>`;

      const tagAgilidade = mod.agilidade >= 0 
        ? `<span class="impacto-item impacto-pos">+Agilidade (+${mod.agilidade})</span>` 
        : `<span class="impacto-item impacto-neg">-Agilidade (${mod.agilidade})</span>`;

      const elBioRot = document.getElementById('bio-rotulo-biotipo');
      if (elBioRot) elBioRot.innerText = rotulo;
      const elBioRes = document.getElementById('bio-resumo-tags');
      if (elBioRes) elBioRes.innerText = tagResumo;
      document.getElementById('bio-impactos-dinamicos').innerHTML = `${tagRitmo}${tagAgilidade}${tagForca}${tagSalto}`;

      inicializarAtributosBase();
    }

    function obterNomeCompletoPosicao(p) {

        'SA': 'Segundo Atacante', 'ATA': 'Centroavante'
      };
      return mapa[p] || p;
    }

    function carregarArquotiposParaPosicao(pos) {
      const arqs = ARQUETIPOS_POR_POSICAO[pos] || [
        { nome: 'Padrão Versátil', desc: 'Atleta consistente e equilibrado nas ações com e sem a bola.' }
      ];
      const sel = document.getElementById('select-arquetipo');
      if (!sel) return;
      sel.innerHTML = '';
      arqs.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.nome;
        opt.innerText = a.nome;
        sel.appendChild(opt);
      });
      atualizarDescricaoArquetipo();
    }

    function atualizarDescricaoArquetipo() {
      const sel = document.getElementById('select-arquetipo');
      const pos = estado.posicao;
      const arqs = ARQUETIPOS_POR_POSICAO[pos] || [];
      const achado = arqs.find(a => a.nome === sel.value);
      if (achado) {
        document.getElementById('txt-desc-arquetipo').innerText = achado.desc;
        estado.arquetipo = achado.nome;
      }
    }

    function inicializarAtributosBase() {
      const p = estado.posicao;
      const m = estado.modFisico;
      const isGol = (p === 'GOL');

      let base = {};

      if (isGol) {
        base = {
          mergulho_baixo: 58 + Math.round(m.agilidade * 0.5),
          mergulho_alto: 60 + Math.round(m.cabeceio * 0.5),
          firmeza_mao: 59 + Math.round(m.forca * 0.4),
          encaixe: 58,
          tiro_meta: 60,
          passe_saida: 57,
          reacao_queima: 62 + Math.round(m.agilidade * 0.6),
          tempo_reacao: 60,
          saida_chao: 58 + Math.round(m.ritmo * 0.5),
          agilidade_gol: 59 + Math.round(m.agilidade * 0.5),
          pos_bola_rolando: 60,
          fechar_angulo: 60
        };
      } else {
        const pesosPos = {
          'ATA': { rit: 62, fin: 63, pas: 54, dri: 59, def: 35, fis: 60 },
          'SA':  { rit: 63, fin: 61, pas: 58, dri: 62, def: 36, fis: 55 },
          'PE':  { rit: 66, fin: 58, pas: 56, dri: 64, def: 35, fis: 52 },
          'PD':  { rit: 66, fin: 58, pas: 56, dri: 64, def: 35, fis: 52 },
          'MEI': { rit: 60, fin: 57, pas: 63, dri: 63, def: 42, fis: 55 },
          'MC':  { rit: 60, fin: 55, pas: 62, dri: 60, def: 52, fis: 60 },
          'ME':  { rit: 64, fin: 54, pas: 60, dri: 61, def: 45, fis: 54 },
          'MD':  { rit: 64, fin: 54, pas: 60, dri: 61, def: 45, fis: 54 },
          'VOL': { rit: 56, fin: 48, pas: 59, dri: 57, def: 62, fis: 63 },
          'LE':  { rit: 64, fin: 46, pas: 57, dri: 58, def: 60, fis: 58 },
          'LD':  { rit: 64, fin: 46, pas: 57, dri: 58, def: 60, fis: 58 },
          'ZAE': { rit: 54, fin: 35, pas: 52, dri: 50, def: 64, fis: 64 },
          'ZAD': { rit: 54, fin: 35, pas: 52, dri: 50, def: 64, fis: 64 }
        }[p] || { rit: 60, fin: 55, pas: 60, dri: 58, def: 50, fis: 58 };

        base = {
          aceleracao: Math.max(45, pesosPos.rit + m.ritmo),
          pique: Math.max(45, pesosPos.rit + Math.round(m.ritmo * 0.8)),
          finalizacao: Math.max(30, pesosPos.fin),
          chute_forca: Math.max(35, pesosPos.fin + Math.round(m.forca * 0.5)),
          visao: Math.max(40, pesosPos.pas),
          passe_curto: Math.max(45, pesosPos.pas),
          agilidade: Math.max(45, pesosPos.dri + m.agilidade),
          controle_bola: Math.max(45, pesosPos.dri),
          interceptacao: Math.max(30, pesosPos.def),
          desarme: Math.max(30, pesosPos.def),
          forca: Math.max(40, pesosPos.fis + m.forca),
          folego: Math.max(45, pesosPos.fis + m.folego)
        };
      }

      estado.atributosBase = { ...base };
      estado.atributos = { ...base };
      estado.pontosDisponiveis = 30;

      recalcularOverall();
      renderizarCardPrincipal();
      renderizarClustersHabilidades();
    }

    function recalcularOverall() {
      const p = estado.posicao;
      const at = estado.atributos;
      let ovr = 60;

      if (p === 'GOL') {
        const ela = (at.mergulho_baixo + at.mergulho_alto) / 2;
        const man = (at.firmeza_mao + at.encaixe) / 2;
        const rep = (at.tiro_meta + at.passe_saida) / 2;
        const ref = (at.reacao_queima + at.tempo_reacao) / 2;
        const vel = (at.saida_chao + at.agilidade_gol) / 2;
        const pos = (at.pos_bola_rolando + at.fechar_angulo) / 2;
        ovr = Math.round(0.24 * ref + 0.24 * ela + 0.20 * pos + 0.16 * man + 0.10 * rep + 0.06 * vel);
      } else {
        const rit = (at.aceleracao + at.pique) / 2;
        const fin = (at.finalizacao + at.chute_forca) / 2;
        const pas = (at.visao + at.passe_curto) / 2;
        const dri = (at.agilidade + at.controle_bola) / 2;
        const def = (at.interceptacao + at.desarme) / 2;
        const fis = (at.forca + at.folego) / 2;

        const pesos = {
          'ATA': { rit: 0.20, fin: 0.35, pas: 0.10, dri: 0.20, def: 0.02, fis: 0.13 },
          'SA':  { rit: 0.22, fin: 0.28, pas: 0.18, dri: 0.22, def: 0.02, fis: 0.08 },
          'PE':  { rit: 0.30, fin: 0.20, pas: 0.15, dri: 0.25, def: 0.02, fis: 0.08 },
          'PD':  { rit: 0.30, fin: 0.20, pas: 0.15, dri: 0.25, def: 0.02, fis: 0.08 },
          'MEI': { rit: 0.15, fin: 0.18, pas: 0.32, dri: 0.25, def: 0.04, fis: 0.06 },
          'MC':  { rit: 0.14, fin: 0.12, pas: 0.28, dri: 0.18, def: 0.16, fis: 0.12 },
          'ME':  { rit: 0.26, fin: 0.14, pas: 0.22, dri: 0.24, def: 0.06, fis: 0.08 },
          'MD':  { rit: 0.26, fin: 0.14, pas: 0.22, dri: 0.24, def: 0.06, fis: 0.08 },
          'VOL': { rit: 0.10, fin: 0.05, pas: 0.22, dri: 0.12, def: 0.32, fis: 0.19 },
          'LE':  { rit: 0.24, fin: 0.05, pas: 0.18, dri: 0.16, def: 0.24, fis: 0.13 },
          'LD':  { rit: 0.24, fin: 0.05, pas: 0.18, dri: 0.16, def: 0.24, fis: 0.13 },
          'ZAE': { rit: 0.12, fin: 0.02, pas: 0.10, dri: 0.06, def: 0.42, fis: 0.28 },
          'ZAD': { rit: 0.12, fin: 0.02, pas: 0.10, dri: 0.06, def: 0.42, fis: 0.28 }
        }[p] || { rit: 0.16, fin: 0.16, pas: 0.20, dri: 0.18, def: 0.15, fis: 0.15 };

        ovr = Math.round(
          pesos.rit * rit +
          pesos.fin * fin +
          pesos.pas * pas +
          pesos.dri * dri +
          pesos.def * def +
          pesos.fis * fis
        );
      }

      estado.overallAtual = Math.max(55, Math.min(85, ovr));

      const elOvrSkills = document.getElementById('disp-ovr-skills');
      if (elOvrSkills) elOvrSkills.innerText = estado.overallAtual;
    }

    function obterStatsAgrupadas() {
      const p = estado.posicao;
      const at = estado.atributos;

      if (p === 'GOL') {
        return [
          { sigla: 'ELA', nome: 'Elasticidade', val: Math.round((at.mergulho_baixo + at.mergulho_alto) / 2) },
          { sigla: 'MAN', nome: 'Manejo', val: Math.round((at.firmeza_mao + at.encaixe) / 2) },
          { sigla: 'REP', nome: 'Reposição', val: Math.round((at.tiro_meta + at.passe_saida) / 2) },
          { sigla: 'REF', nome: 'Reflexos', val: Math.round((at.reacao_queima + at.tempo_reacao) / 2) },
          { sigla: 'VEL', nome: 'Velocidade', val: Math.round((at.saida_chao + at.agilidade_gol) / 2) },
          { sigla: 'POS', nome: 'Posição', val: Math.round((at.pos_bola_rolando + at.fechar_angulo) / 2) }
        ];
      }

      return [
        { sigla: 'RIT', nome: 'Ritmo', val: Math.round((at.aceleracao + at.pique) / 2) },
        { sigla: 'FIN', nome: 'Finalização', val: Math.round((at.finalizacao + at.chute_forca) / 2) },
        { sigla: 'PAS', nome: 'Passe', val: Math.round((at.visao + at.passe_curto) / 2) },
        { sigla: 'DRI', nome: 'Drible', val: Math.round((at.agilidade + at.controle_bola) / 2) },
        { sigla: 'DEF', nome: 'Defesa', val: Math.round((at.interceptacao + at.desarme) / 2) },
        { sigla: 'FIS', nome: 'Físico', val: Math.round((at.forca + at.folego) / 2) }
      ];
    }

    /* ========================================================
       RENDERIZAÇÃO DO CARD OFICIAL DEFINITIVO DO PROMESSA

    // Renderiza o card principal no estúdio
    function renderizarCardPrincipal() {
      const slot = document.getElementById('main-card-slot');
      if (slot) {
        slot.innerHTML = gerarHTMLCardOficial();
      }
    }

    // Custo escalonado
    function obterCustoUpgrade(valAtual) {
      if (valAtual < 65) return 1;
      if (valAtual < 75) return 2;
      if (valAtual < 85) return 3;
      return 4;
    }

    function alterarAtributo(chave, delta) {
      const valAtual = estado.atributos[chave];
      const valMinimo = estado.atributosBase[chave];

      if (delta < 0) {
        if (valAtual <= valMinimo) return;
        const custoReembolso = obterCustoUpgrade(valAtual - 1);
        estado.atributos[chave] -= 1;
        estado.pontosDisponiveis += custoReembolso;
      } else {
        if (estado.overallAtual >= 70) {
          alert('Limite de pontos para a fase de criação atingido! Conclua a criação ou realoque seus pontos.');
          return;
        }
        const custo = obterCustoUpgrade(valAtual);
        if (estado.pontosDisponiveis < custo) {
          alert(`Pontos insuficientes! Subir este atributo a partir de ${valAtual} custa ${custo} pontos.`);
          return;
        }
        estado.atributos[chave] += 1;
        estado.pontosDisponiveis -= custo;
      }

      recalcularOverall();
      renderizarCardPrincipal();
      renderizarClustersHabilidades();
    }

    function renderizarClustersHabilidades() {
      const container = document.getElementById('clusters-container');
      if (!container) return;
      const isGol = (estado.posicao === 'GOL');
      const clusters = isGol ? CLUSTERS_GOLEIRO : CLUSTERS_LINHA;

      const elPts = document.getElementById('disp-pts-restantes');
      if (elPts) elPts.innerText = estado.pontosDisponiveis;

      container.innerHTML = clusters.map(c => {
        let soma = 0;
        c.itens.forEach(it => { soma += estado.atributos[it.chave]; });
        const media = Math.round(soma / c.itens.length);

        const rowsHTML = c.itens.map(it => {
          const val = estado.atributos[it.chave];
          const min = estado.atributosBase[it.chave];
          const isMin = (val <= min);
          const custoProx = obterCustoUpgrade(val);

          return `
            <div class="skill-item-row">
              <div>
                <div class="skill-item-lbl">${it.nome}</div>
                <div style="font-size:9px; color:#8FAFA0;">Nível Inicial: ${min} · Custo próx: ${custoProx} pt${custoProx > 1 ? 's' : ''}</div>
              </div>
              <div class="skill-controls">
                <button type="button" class="btn-step" onclick="alterarAtributo('${it.chave}', -1)" ${isMin ? 'disabled' : ''}>-</button>
                <span class="skill-val-display">${val}</span>
                <button type="button" class="btn-step" onclick="alterarAtributo('${it.chave}', 1)">+</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="skill-cluster">
            <div class="cluster-header">
              <span class="cluster-title">${c.nome}</span>
              <span class="cluster-media-val">${media}</span>
            </div>
            ${rowsHTML}
          </div>
        `;
      }).join('');
    }

    function concluirCriacao() {
      const inNome = document.getElementById('in-nome');
      if (inNome) {
        if (!inNome.value || !inNome.value.trim()) inNome.value = 'Arthur';
        inNome.dispatchEvent(new Event('input', { bubbles: true }));
      }
      const inSob = document.getElementById('in-sobrenome');
      if (inSob) {
        if (!inSob.value || !inSob.value.trim()) inSob.value = 'Silva';
        inSob.dispatchEvent(new Event('input', { bubbles: true }));
      }
      const inCam = document.getElementById('in-camisa');
      if (inCam) {
        if (!inCam.value || !inCam.value.trim()) inCam.value = '10';
        inCam.dispatchEvent(new Event('input', { bubbles: true }));
      }

      try {
        const payload = {
          nome: (inNome && inNome.value.trim()) || estado.nome || 'Arthur',
          sobrenome: (inSob && inSob.value.trim()) || estado.sobrenome || 'Silva',
          camisa: parseInt((inCam && inCam.value) || estado.numeroCamisa || 10, 10),
          posicao: estado.posicao || 'MC',
          arquetipo: estado.arquetipo || 'Meio-Campista Box-to-Box',
          altura: estado.altura || 175,
          peso: estado.peso || 70,
          peDominante: estado.peDominante || 'Destro',
          peFraco: estado.peFraco || 3,
          ovr: estado.overallAtual || 59,
          skills: Object.assign({}, estado.atributos || {})
        };
        localStorage.setItem('promessa-novo-craque', JSON.stringify(payload));
      } catch (e) {
        console.error('Erro salvando atleta em localStorage:', e);
      }
      
      const realBtn = document.getElementById('btn-real-submit');
      if (realBtn) {
        realBtn.click();
      } else {
        alert(`Parabéns! Seu contrato profissional foi registrado com OVR ${estado.overallAtual} geral!`);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      recalcularFisico();
      carregarArquotiposParaPosicao(estado.posicao);
      renderizarCardPrincipal();
    });


// Garantir inicialização e renderização completa dos componentes do Craque

    if (typeof selecionarPosicao === 'function') selecionarPosicao(pos);

    const val = parseInt(btn.getAttribute('data-val'), 10);
    if (typeof definirPeFraco === 'function') definirPeFraco(val);
    garantirInicializacaoCraque();
  } else if (act === 'concluir-craque') {
    if (typeof concluirCriacao === 'function') concluirCriacao();

    const bp = document.getElementById('btn-real-peneira'); if (bp) bp.click();
    if (typeof trocarTela === 'function') trocarTela('tela-estudio', btn);
    garantirInicializacaoCraque();

});

// Observador para quando a tela de criação for montada pelo Dual Canvas
(function() {

<script id="promessa-cria-ponte">
/* PONTE CRIACAO v3 -> MOTOR PRO (restaurada 30/09).
   A tela nova guarda tudo em `estado` (habilidades com nomes proprios);
   o contrato e o motor leem window.skillsStats / window.posicaoAtleta /
   window.ovrDaCriacao. Sem esta ponte o contrato ia sem atributos e o
   overall da carreira voltava a ser sorteado (58-66), diferente do card. */
(function () {
  var MAPA = { ace: 'aceleracao', vel: 'pique', fin: 'finalizacao', chu: 'chute_forca', vis: 'visao', pas: 'passe_curto',
               agi: 'agilidade', con: 'controle_bola', int: 'interceptacao', des: 'desarme', 'for': 'forca', fol: 'folego' };
  function est() { try { return estado; } catch (e) { return null; } }
  function skills() {
    var e = est(); if (!e) return null;
    var a = e.atributos || {}, o = {};
    for (var k in MAPA) if (a[MAPA[k]] != null) o[k] = Number(a[MAPA[k]]);
    if (e.posicao === 'GOL') {
      var m = function (x, y) { return Math.round(((Number(a[x]) || 60) + (Number(a[y]) || 60)) / 2); };
      o.gk = { 'GK:ref': m('reacao_queima', 'tempo_reacao'), 'GK:ela': m('mergulho_baixo', 'mergulho_alto'),
               'GK:col': m('pos_bola_rolando', 'fechar_angulo'), 'GK:pes': m('tiro_meta', 'passe_saida') };
    }
    o.alt = Number(e.altura) || null;
    o.imc = e.altura ? Number(e.peso) / Math.pow(e.altura / 100, 2) : null;
    return o;
  }
  try {
    Object.defineProperty(window, 'skillsStats', { configurable: true, get: skills, set: function () {} });
    Object.defineProperty(window, 'posicaoAtleta', { configurable: true, get: function () { var e = est(); return (e && e.posicao) || 'MC'; }, set: function () {} });
  } catch (err) { console.error('[ponte criacao] defineProperty falhou:', err); }

  window.pos5DaCriacao = function () {
    var p = window.posicaoAtleta;
    if (p === 'GOL') return 'GOL';
    if (p === 'ZAE' || p === 'ZAD' || p === 'ZAG') return 'ZAG';
    if (p === 'LE' || p === 'LD') return 'LAT';
    if (p === 'PE' || p === 'PD' || p === 'SA' || p === 'ATA') return 'ATA';
    return 'MEI';
  };
  window.ovrDaCriacao = function () {
    var A = window.PromessaAtributos, e = est();
    if (!A || !A.proDeSkillsV2) return (e && e.overallAtual) || null;
    var p5 = window.pos5DaCriacao();
    return Math.round(A.overallDeAtributos(A.proDeSkillsV2(skills(), p5), p5));
  };

  /* o card mostra o overall do motor: e o mesmo com que a carreira comeca */
  if (typeof recalcularOverall === 'function') {
    var orig = recalcularOverall;
    recalcularOverall = function () {
      var r = orig.apply(this, arguments);
      var o = window.ovrDaCriacao(), e = est();
      if (o && e) {
        e.overallAtual = o;
        var el = document.getElementById('disp-ovr-skills'); if (el) el.innerText = o;
      }
      return r;
    };
  } else console.warn('[ponte criacao] recalcularOverall nao existe; card e carreira podem divergir');

  /* bandeira do card: a nacionalidade real esta no select do runtime */
  window.criaPaisSlug = function () {
    var op = document.querySelector('.pm-cria-bet option[value="afeganistao"]');
    var v = op && op.parentElement ? op.parentElement.value : '';
    return /^[a-z0-9_]+$/.test(v) ? v : 'brasil';
  };
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.tagName === 'SELECT' && t.querySelector('option[value="afeganistao"]') && typeof renderizarCardPrincipal === 'function') {
      setTimeout(function () { try { recalcularOverall(); renderizarCardPrincipal(); } catch (err) { console.error('[ponte criacao] card:', err); } }, 30);
    }
  });
  /* posicao da tela (14 pinos) -> as 8 do contrato; pe no formato do runtime */
  var POS_CONTRATO = { GOL: 'GOL', ZAE: 'ZAG', ZAD: 'ZAG', LE: 'LAT', LD: 'LAT', VOL: 'VOL', MC: 'MEI', MEI: 'MEI',
                       ME: 'MEI', MD: 'MEI', PE: 'PON', PD: 'PON', SA: 'SA', ATA: 'ATA' };
  window.criaContrato = function () {
    var e = est(); if (!e) return {};
    var num = function (x, lo, hi) { var v = Math.round(Number(x)); return isFinite(v) && v >= lo && v <= hi ? v : null; };
    return { position: POS_CONTRATO[e.posicao] || 'MEI',
             foot: String(e.peDominante || '').toLowerCase() === 'canhoto' ? 'canhoto' : 'destro',
             height: num(e.altura, 150, 210), weight: num(e.peso, 45, 110), weakFoot: num(e.peFraco, 1, 5) };
  };
})();

/* ==== Criacao v3 — card sem clube, biotipo equilibrado, pontos que nao somem (01/10) ==== */
(function () {
  function est() { try { return estado; } catch (e) { return null; } }
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

  /* --- 1. Biotipo. Referencia 1,75 m / 70 kg. Antes: alto+pesado perdia
     ~14 pontos somados e o ganho (cabeceio/impulsao) nao entrava em nenhum
     atributo de linha — zagueiro alto saia pior. Agora a troca e quase
     neutra: velocidade e agilidade por forca, jogo aereo e defesa. --- */
  if (typeof recalcularFisico === 'function') {
    recalcularFisico = function () {
      var e = est(); if (!e) return;
      var elAlt = document.getElementById('slider-alt');
      var elPes = document.getElementById('slider-pes');
      if (!elAlt || !elPes) return;
      var alt = clamp(parseInt(elAlt.value, 10) || 175, 160, 202);
      var h = alt / 100;
      /* peso possivel para a altura: IMC 18,5 a 29 (fora disso nao e atleta) */
      var pMin = Math.max(55, Math.ceil(18.5 * h * h)), pMax = Math.min(105, Math.floor(29 * h * h));
      elPes.min = pMin; elPes.max = pMax;
      var pes = clamp(parseInt(elPes.value, 10) || 70, pMin, pMax);
      if (String(pes) !== elPes.value) elPes.value = pes;
      e.altura = alt; e.peso = pes;

      var t = document.getElementById('txt-val-alt'); if (t) t.innerText = h.toFixed(2).replace('.', ',') + ' m';
      t = document.getElementById('txt-val-pes'); if (t) t.innerText = pes + ' kg';

      var da = alt - 175, dp = pes - 70, r = Math.round;
      var mod = {
        ritmo:     r(-0.15 * da - 0.12 * dp),

        salto:     r( 0.10 * da - 0.20 * dp),
        cabeceio:  r( 0.32 * da + 0.05 * dp),
        folego:    r(-0.04 * da - 0.10 * dp)

      e.modFisico = mod;

      var imc = pes / (h * h);
      var estat = alt <= 168 ? 'Baixo' : alt >= 188 ? 'Muito alto' : alt >= 182 ? 'Alto' : 'Médio';
      var porte = imc < 21 ? 'leve' : imc >= 26.5 ? 'robusto' : imc >= 24 ? 'forte' : 'equilibrado';
      var rot = estat + ' e ' + porte, resumo = 'Equilíbrio geral';
      if (alt >= 192 && imc >= 25) { rot = 'Muralha'; resumo = 'Força e jogo aéreo'; }
      else if (alt >= 190 && imc < 22.5) { rot = 'Longilíneo'; resumo = 'Alcance e cabeceio'; }
      else if (alt <= 170 && imc <= 22.5) { rot = 'Baixo e veloz'; resumo = 'Arranque e giro curto'; }
      else if (alt <= 172 && imc >= 26) { rot = 'Baixo e compacto'; resumo = 'Equilíbrio e proteção de bola'; }
      else if (porte === 'leve') resumo = 'Leveza e velocidade';
      else if (porte === 'robusto') resumo = 'Contato e proteção de bola';

      t = document.getElementById('bio-rotulo-biotipo'); if (t) t.innerText = rot;

        return '<span class="' + cls + '"><b>' + (v > 0 ? '+' : '') + v + '</b>' + x[0] + '</span>';
      }).join('');

      inicializarAtributosBase();
    };
  }

  /* --- 2. Os pontos gastos nao podem sumir. Qualquer clique com
     data-action (pe, pe fraco, voltar, posicao) chamava
     garantirInicializacaoCraque -> inicializarAtributosBase, que zerava a
     arvore e devolvia os 30 pontos sem avisar. Agora o investimento por
     habilidade e reaplicado em cima da base nova. --- */
  if (typeof inicializarAtributosBase === 'function') {
    var origInit = inicializarAtributosBase;
    inicializarAtributosBase = function () {
      var e = est(); if (!e) return origInit.apply(this, arguments);
      var antes = {}, base0 = e.atributosBase || {}, atr0 = e.atributos || {};
      for (var k in atr0) if (base0[k] != null) antes[k] = atr0[k] - base0[k];
      origInit.apply(this, arguments);
      var m = e.modFisico || {};
      /* jogo aereo entra na defesa de linha (interceptacao pelo alto) */
      if (e.posicao !== 'GOL' && e.atributosBase.interceptacao != null) {
        var ad = Math.round((m.cabeceio || 0) * 0.4);

        e.atributos.interceptacao = e.atributosBase.interceptacao;

      for (var k2 in antes) {
        if (!(k2 in e.atributosBase)) { ok = false; break; }
        for (var v = e.atributosBase[k2]; v < e.atributosBase[k2] + antes[k2]; v++) custo += obterCustoUpgrade(v);
      }
      if (ok && custo <= 30) {
        for (var k3 in antes) e.atributos[k3] = e.atributosBase[k3] + antes[k3];
        e.pontosDisponiveis = 30 - custo;
      }
      recalcularOverall();
      renderizarCardPrincipal();
      renderizarClustersHabilidades();
    };
  }

  /* --- 3. Card da criacao: ainda nao ha clube, entao nada de "manto
     oficial", escudo ou registro de federacao. Dentro do jogo o card ganha
     a camisa do time (Dashboard). --- */
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

    return '' +

          '</div>' +
        '</div>' +
        '<div class="cpo-name-banner">' +

        }).join('') + '</div>' +

  };
})();

/* ==== Biotipo v2 (01/10): altura e peso independentes, efeito pelo IMC ====
   Antes o peso entrava linear: +peso = +forca e +jogo aereo, entao um
   jogador muito acima do peso "ganhava" no alto. Agora separa massa util
   (IMC ate ~26: forca) de excesso (IMC acima de 25,5: pesa em velocidade,
   agilidade, folego e IMPULSAO). Jogo aereo = altura + impulsao.
   Referencia neutra: 1,75 m / 70 kg (IMC 22,9). Cada efeito limitado a ±15. */
(function () {
  function est() { try { return estado; } catch (e) { return null; } }
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var lim = function (x) { return clamp(Math.round(x), -15, 15); };
  recalcularFisico = function () {
    var e = est(); if (!e) return;
    var elAlt = document.getElementById('slider-alt'), elPes = document.getElementById('slider-pes');
    if (!elAlt || !elPes) return;
    /* valor inicial uma vez por elemento montado (o markup vem sem value) */
    if (!elAlt.dataset.pronto) { elAlt.value = e.altura || 175; elPes.value = e.peso || 70; elAlt.dataset.pronto = '1'; }
    /* um slider nunca mexe no outro */
    var alt = clamp(parseInt(elAlt.value, 10) || 175, 160, 202);
    var pes = clamp(parseInt(elPes.value, 10) || 70, 55, 105);
    e.altura = alt; e.peso = pes;
    var hm = alt / 100, imc = pes / (hm * hm);
    var t = document.getElementById('txt-val-alt'); if (t) t.innerText = hm.toFixed(2).replace('.', ',') + ' m';
    t = document.getElementById('txt-val-pes'); if (t) t.innerText = pes + ' kg';

    var h = alt - 175;
    var massa = clamp(imc - 23, -5, 3);        /* musculo: ajuda forca ate certo ponto */
    var gordura = Math.max(0, imc - 25.5);      /* excesso: so atrapalha, inclusive no alto */
    var acima = Math.max(0, imc - 23);
    var magro = Math.max(0, 20.5 - imc);
    var mod = {
      ritmo:     lim(-0.12 * h - 0.8 * acima - 1.5 * gordura),
      agilidade: lim(-0.18 * h - 1.0 * acima - 1.8 * gordura + 0.6 * magro),
      forca:     lim( 0.10 * h + 1.8 * massa + 0.5 * gordura),
      salto:     lim( 0.08 * h - 0.8 * acima - 1.5 * gordura),
      cabeceio:  lim( 0.32 * h + 0.4 * massa - 2.0 * gordura),
      folego:    lim(-0.04 * h - 0.6 * Math.max(0, imc - 23.5) - 1.8 * gordura - 0.8 * magro)
    };
    e.modFisico = mod;

    var estat = alt <= 168 ? 'Baixo' : alt >= 190 ? 'Muito alto' : alt >= 182 ? 'Alto' : 'Médio';
    var porte = imc < 20 ? 'magro' : imc < 23.5 ? 'atlético' : imc < 26 ? 'forte' : imc < 28 ? 'pesado' : 'acima do peso';
    var resumo = imc >= 28 ? 'Força no contato, mas lento e sem fôlego'
      : imc >= 26 ? 'Contato forte, perde arranque'
      : imc < 20 ? 'Leve, perde nas disputas'
      : alt >= 188 ? 'Alcance e jogo aéreo'
      : alt <= 170 ? 'Arranque e giro curto'
      : imc >= 23.5 ? 'Potência e disputa' : 'Equilíbrio geral';
    t = document.getElementById('bio-rotulo-biotipo'); if (t) t.innerText = estat + ' e ' + porte;
    t = document.getElementById('bio-resumo-tags'); if (t) t.innerText = resumo;
    var itens = [['Velocidade', mod.ritmo], ['Agilidade', mod.agilidade], ['Força', mod.forca], ['Jogo aéreo', mod.cabeceio], ['Fôlego', mod.folego]];
    t = document.getElementById('bio-impactos-dinamicos');
    if (t) t.innerHTML = itens.map(function (x) {
      var v = x[1], cls = v > 0 ? 'bio-imp pos' : v < 0 ? 'bio-imp neg' : 'bio-imp zero';
      return '<span class="' + cls + '"><b>' + (v > 0 ? '+' : '') + v + '</b>' + x[0] + '</span>';
    }).join('');
    inicializarAtributosBase();
  };
})();

/* ==== Biotipo v3 (02/10) — base: tabela do EA FC Pro Clubs ====
   Altura (cada 4 cm a partir de 1,75 m = 1 ponto):
     mais alto  -> + velocidade (pique), forca, impulsao  | - aceleracao, agilidade, equilibrio
   Peso, medido contra o peso natural da altura (IMC 22,9; cada 8 kg = 1 ponto):
     mais pesado -> + forca, equilibrio                   | - aceleracao, agilidade, velocidade
   Goleiro: alto = + mergulho, reflexo, saida | - firmeza, agilidade; pesado = + firmeza | - mergulho, reflexo, saida.
   Onde o PROMESSA difere do FC, de proposito:
   - no FC o peso tambem da impulsao; aqui so dentro do peso atletico (IMC ate 25);
   - o FC limita o peso pela altura; aqui os sliders sao livres, entao acima de
     IMC 27 (fora do peso de atleta) entra uma penalidade extra em arranque,
     agilidade, velocidade, impulsao e folego, e abaixo de IMC 19 perde forca e folego. */
(function () {
  function est() { try { return estado; } catch (e) { return null; } }
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var lim = function (x) { return clamp(Math.round(x), -15, 15); };
  /* como no FC: 1-4 cm = 1, 5-8 cm = 2...; 1-8 kg = 1, 9-16 kg = 2... (arredonda antes: 0,1 kg nao conta) */
  var passo = function (d, por, max) { d = Math.round(d); return d === 0 ? 0 : Math.sign(d) * Math.min(max, Math.ceil(Math.abs(d) / por)); };

  function calcular(alt, pes) {
    var hm = alt / 100, imc = pes / (hm * hm);
    var hs = passo(alt - 175, 4, 5);
    var ws = passo(pes - 22.9 * hm * hm, 8, 4);
    var ex = Math.max(0, imc - 27), mg = Math.max(0, 19 - imc);
    return {
      imc: imc,
      acel:  lim(-hs - ws - 2 * ex),
      pique: lim( hs - ws - 2 * ex),
      agil:  lim(-hs - ws - 2 * ex),
      equil: lim(-hs + ws - ex),
      forca: lim( hs + ws - 2 * mg),
      aereo: lim( hs + (imc <= 25 ? Math.max(0, ws) : 0) - 2 * ex),
      folego: lim(-2 * ex - mg),
      gkMerg: lim( hs - ws - ex), gkRefl: lim(hs - ws - ex), gkFirm: lim(-hs + ws),
      gkSaida: lim(hs - ws - 2 * ex), gkAgil: lim(-hs - ws - 2 * ex)
    };
  }
  window.biotipoPromessa = calcular;

  recalcularFisico = function () {
    var e = est(); if (!e) return;
    var elAlt = document.getElementById('slider-alt'), elPes = document.getElementById('slider-pes');
    if (!elAlt || !elPes) return;
    if (!elAlt.dataset.pronto) { elAlt.value = e.altura || 175; elPes.value = e.peso || 70; elAlt.dataset.pronto = '1'; }

    var imc = b.imc;

    var itens = gol
      ? [['Mergulho', b.gkMerg], ['Reflexo', b.gkRefl], ['Firmeza', b.gkFirm], ['Saída do gol', b.gkSaida], ['Agilidade', b.gkAgil]]

  /* o script original aplica 'ritmo' na aceleracao E no pique (x0,8) e nao
     tem equilibrio; aqui corrige por soma, preservando arquetipo e pontos */
  var prevI = inicializarAtributosBase;
  inicializarAtributosBase = function () {
    var r = prevI.apply(this, arguments), e = est();
    if (!e || !e.bio) return r;

      ex = { mergulho_baixo: b.gkMerg, mergulho_alto: b.gkMerg, reacao_queima: b.gkRefl, tempo_reacao: b.gkRefl,

    } else {
      ex = { pique: b.pique - Math.round(b.acel * 0.8), controle_bola: Math.round(b.equil * 0.5) };
    }
    for (var k in ex) if (ex[k] && e.atributosBase[k] != null) {
      e.atributosBase[k] = Math.max(30, e.atributosBase[k] + ex[k]);

/* ==== Arvore de atributos (02/10): sem alert(), + desligado quando nao da,

  var LIMITE_OVR = 70;
  if (typeof alterarAtributo === 'function') {
    var prevA = alterarAtributo;

      var orig = window.alert;
      window.alert = function (m) {

        aviso(/Limite/i.test(m) ? 'O overall máximo na criação é ' + LIMITE_OVR + '. O resto vem jogando.'
          : /insuficientes/i.test(m) ? m.replace('Pontos insuficientes! ', 'Faltam pontos: ') : m);

        var pode = !travado && pts >= custo;
        var motivo = travado ? 'Overall máximo da criação' : pts < custo ? 'Custa ' + custo + ' pts' : 'Subir ' + it.nome;
        return '<div class="skill-item-row' + (inv > 0 ? ' investido' : '') + '">' +
          '<div><div class="skill-item-lbl">' + it.nome + '</div>' +

          '<div class="skill-controls">' +
            '<button type="button" class="btn-step" aria-label="Diminuir ' + it.nome + '" onclick="alterarAtributo(\'' + it.chave + '\', -1)"' + (inv <= 0 ? ' disabled' : '') + '>−</button>' +
            '<span class="skill-val-display">' + v + '</span>' +
            '<button type="button" class="btn-step" aria-label="' + motivo + '" title="' + motivo + '" onclick="alterarAtributo(\'' + it.chave + '\', 1)"' + (pode ? '' : ' disabled') + '>+</button>' +
          '</div></div>';

      return '<div class="skill-cluster"><div class="cluster-header"><span class="cluster-title">' + c.nome + '</span>' +
        '<span class="cluster-media-val">' + Math.round(soma / c.itens.length) + '</span></div>' + linhas + '</div>';
    }).join('');
  };

  /* concluir com pontos sobrando: avisa uma vez (eles nao passam para a carreira) */
  if (typeof concluirCriacao === 'function') {

      var e = est();

        return;

  function nivelar(sk, p) {

    if (delta) for (const k in sk) sk[k] = clamp(sk[k] + delta, CRIACAO.piso, 85);

  /* posição da criação (13) -> as 5 do motor */
  function pos5De(p) {

    if (p === 'GOL') return 'GOL';
    if (p === 'ZAE' || p === 'ZAD' || p === 'ZAG') return 'ZAG';
    if (p === 'LE' || p === 'LD' || p === 'LAT') return 'LAT';
    if (p === 'ATA' || p === 'SA' || p === 'PE' || p === 'PD' || p === 'PON') return 'ATA';

  /* Saves de antes da árvore v3: monta as habilidades a partir dos 10 atributos. */
  function deAtributos(atr, pos5) {
    const P = ehGol(pos5) ? PONTE_GOL : PONTE_LINHA, soma = {}, peso = {};
    for (const a in P) for (const k in P[a]) { if (k === '_aer') continue; soma[k] = (soma[k] || 0) + (Number(atr[a]) || 50) * P[a][k]; peso[k] = (peso[k] || 0) + P[a][k]; }
    const sk = {};
    for (const k of chaves(pos5)) sk[k] = peso[k] ? clamp(Math.round(soma[k] / peso[k]), 1, 99) : 55;

    pas: [{ a: 0.02 }, { a: 0.03 }, { a: 0.04 }], dri: [{ dr: 0.03 }, { dr: 0.03 }, { dr: 0.04, a: 0.01 }],
    def: [{ tk: 0.03 }, { tk: 0.03 }, { tk: 0.04 }], fis: [{ nota: 0.03 }, { nota: 0.03 }, { nota: 0.04 }],
    ela: [{ saves: 0.02 }, { saves: 0.03 }, { saves: 0.04 }], man: [{ saves: 0.02 }, { saves: 0.02 }, { saves: 0.03 }],
    rep: [{ a: 0.02 }, { a: 0.02 }, { a: 0.03 }], ref: [{ saves: 0.02 }, { saves: 0.03 }, { saves: 0.04 }],
    agl: [{ saves: 0.01 }, { saves: 0.02 }, { saves: 0.02 }], pgo: [{ saves: 0.02 }, { saves: 0.02 }, { saves: 0.03 }],
  };
  /* Passivas: só as ATIVAS dão efeito, no máximo MAX_PASSIVAS. ativos = ['grupo:nivel', ...] escolhidos pelo jogador;

  const MAX_PASSIVAS = 5;
  function passivasAtivas(sk, pos5, ativos) {
    const lst = tracos(sk, pos5);
    if (!Array.isArray(ativos)) return lst.slice().sort((a, b) => b.nivel - a.nivel).slice(0, MAX_PASSIVAS);
    const quer = new Set(ativos);

        c.hab[k] = v + 1; const ganho = ovr(c.hab, pos5) - atual; c.hab[k] = v;

  const DECLINIO = { ace: 1.9, vel: 1.9, agi: 1.3, equ: 1.0, rea: 0.9, fol: 1.5, for: 0.8, imp: 1.2, agr: 0.5, dri: 1.1, con: 0.7, fri: 0.2,
    fin: 0.8, pos: 0.5, chu: 0.7, lon: 0.6, vol: 0.8, pen: 0.2, cab: 0.9, int: 0.7, lei: 0.4, dpe: 1.0, car: 1.1, vis: 0.3, pcu: 0.4, plo: 0.4,
    cru: 0.8, efe: 0.4, fal: 0.3, mba: 1.5, mal: 1.5, rqr: 1.2, tre: 1.2, rec: 1.3, sch: 1.2, fir: 0.6, enc: 0.6, alt: 0.8, tmt: 0.4, psa: 0.5,
    lan: 0.4, dpn: 0.6, pjo: 0.4, fan: 0.4, com: 0.3 };
  function declinio(sk, pos5, quanto) {
    if (!sk || !(quanto > 0)) return;
    const ks = chaves(pos5), media = ks.reduce((s, k) => s + (DECLINIO[k] || 1), 0) / ks.length;

  }

    GRUPOS, MARCOS, REGUA, PPN, MAX_PASSIVAS, CRIACAO, PONTE_LINHA, PONTE_GOL,
    configurar(o) { if (o && typeof o.overall === 'function') overallFn = o.overall; },

<script id="promessa-criacao-v4">

    for (const k in antes) { if (!(k in base)) { ok = false; break; } custo += H.custoEntre(base[k], base[k] + antes[k]); }
    if (ok && custo <= H.CRIACAO.orcamento) {
      for (const k in antes) e.atributos[k] = base[k] + antes[k];
      e.pontosDisponiveis = H.CRIACAO.orcamento - custo;

  /* overall = o do motor (o mesmo com que a carreira começa) */
  recalcularOverall = function () {

<script>
(function () {
  'use strict';
  var ATRASO = 350, INICIO = 130, MINIMO = 40, PASSO = 0.86;
  var ativo = null, engolirClique = false;
  function alvo(btn) {
    var m = /alterarAtributo\('([^']+)',\s*(-?1)\)/.exec(btn.getAttribute('onclick') || '');
    return m ? { chave: m[1], delta: +m[2] } : null;
  }
  function botaoAtual(a) {
    var bs = document.querySelectorAll('.btn-step');
    for (var i = 0; i < bs.length; i++) { var t = alvo(bs[i]); if (t && t.chave === a.chave && t.delta === a.delta) return bs[i]; }
    return null;
  }
  function passo(a) {
    var b = botaoAtual(a);
    if (!b || b.disabled || typeof alterarAtributo !== 'function') return false;
    try { alterarAtributo(a.chave, a.delta); } catch (e) { console.error('[habilidades] falha ao alterar:', e); return false; }
    b = botaoAtual(a);
    return !!(b && !b.disabled);
  }
  function parar() { if (ativo) { clearTimeout(ativo.t); ativo = null; } }
  function agendar(ms) {
    ativo.t = setTimeout(function () {
      if (!ativo) return;
      if (!passo(ativo.a)) return parar();
      agendar(Math.max(MINIMO, ms * PASSO));
    }, ms);
  }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.btn-step');
    if (!b || b.disabled || (e.button !== undefined && e.button !== 0)) return;
    var a = alvo(b); if (!a) return;
    e.preventDefault();               // sem seleção de texto nem menu ao segurar no celular
    parar();
    engolirClique = true;             // o ponto do clique já é dado aqui
    passo(a);
    ativo = { a: a, t: 0 };
    ativo.t = setTimeout(function () { if (ativo) agendar(INICIO); }, ATRASO);
  });
  ['pointerup', 'pointercancel', 'blur'].forEach(function (ev) { window.addEventListener(ev, parar); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) parar(); });
  // o onclick do botão viria depois do pointerdown e daria um ponto a mais
  document.addEventListener('click', function (e) {
    if (!engolirClique) return;
    var b = e.target.closest && e.target.closest('.btn-step');
    engolirClique = false;
    if (b && e.detail !== 0) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  var st = document.createElement('style');
  st.textContent = '.btn-step{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}';
  document.head.appendChild(st);
})();
</script>

/* ---------- tipografia Hero no jogo todo ---------- */
html,html *{--f-disp:'Teko',sans-serif!important;--f-anton:'Teko',sans-serif!important;--f-num:'Teko',sans-serif!important;--f-corpo:'Rajdhani','Segoe UI',system-ui,sans-serif!important;--f-mono:'Rajdhani','Segoe UI',system-ui,sans-serif!important;
  --fd:'Teko',sans-serif!important;--fc:'Rajdhani','Segoe UI',system-ui,sans-serif!important;--fm:'Teko',sans-serif!important}
html *{font-style:normal!important}
body{font-family:'Rajdhani','Segoe UI',system-ui,sans-serif}
/* número da camisa nas cartas: cheio e degradê (o contorno no Teko parecia feito de quadrados) */
.cc-num{color:transparent!important;-webkit-text-stroke:0!important;background:linear-gradient(180deg,rgba(0,255,135,.42),rgba(0,255,135,.06) 85%);-webkit-background-clip:text;background-clip:text;text-shadow:none!important}
.ih-pk .nf,.ct-num{-webkit-text-stroke:0!important;color:rgba(255,255,255,.07)!important}
/* Início: a carta não repete o escudo (já está em cima e no fundo) */
.ih-pk .es{display:none!important}
/* quadrados no fundo: a trama em mix-blend por baixo dos painéis com blur fazia o Chrome repintar em blocos */
.ih-fundo .t,.ct-fundo .trama{mix-blend-mode:normal!important;opacity:.05!important}
.ih-fundo,.ct-fundo{isolation:isolate;contain:paint}
/* quadrado atrás da camisa no Início: filtros (sombra/saturação) dentro de painel com backdrop-filter
   viram camadas retangulares no Chrome; a sombra passa a ser um gradiente e o painel deixa de desfocar o fundo */
.ih .ih-vd,.at2 .vd,html.ih-tema .futx-wrap [style*="18,59,40"],html.ih-tema .futx-wrap [style*="18, 59, 40"],html.ih-tema .futx-wrap [style*="#123B28"]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.ih .ih-vd{background:rgba(4,8,8,.82)!important}
.ih-pk .kit,.ih-pk .mc{filter:none!important}
.ih-pk::after{content:"";position:absolute;left:18%;right:18%;bottom:2%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);pointer-events:none;z-index:0}
.ih-pk .kit{z-index:1}
/* Atleta: o radar cabe no palco (antes a largura passava da altura e o RIT saía cortado em cima) */
.at2 .hr-palco{container-type:size}
.at2 .hc-radar{width:min(100cqw,84cqh)!important;top:45%!important}
/* painel antigo do jogo não aparece antes da tela nova montar */
.futx-wrap.hero-espera > :not(#ih-raiz):not(#ih-fundo){visibility:hidden!important}
/* ---------- fundo da criação = o do teste aprovado ---------- */
html.hero-cria,html.hero-cria body{background:radial-gradient(ellipse at 50% 0,rgba(0,255,135,.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 64px),#04080A!important;background-attachment:fixed!important}
html.hero-cria .hero-fundo-limpo{background:transparent!important}
/* ---------- topo do jogo ---------- */
.ih-trilho img.hero-logo{border-radius:12px;object-fit:cover;object-position:center 20%;box-shadow:0 0 0 1.5px rgba(250,204,21,.45),0 4px 14px rgba(0,0,0,.5)}
.pm-title-sweep{font:700 30px/.8 'Teko',sans-serif!important;font-style:normal!important;letter-spacing:1.5px!important;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;-webkit-text-fill-color:#F2F7F4!important;color:#F2F7F4!important;animation:none!important;text-shadow:none!important}
/* ---------- perfil e biótipo (camada própria) ---------- */
html:has(#tela-estudio.active),html:has(#tela-estudio.active) body{overflow:hidden!important}
/* a troca de tela é decidida pelo CSS na hora (sem esperar o ciclo de 300 ms): sem piscar a tela antiga e a nova */
#hero-perfil{display:none!important}
html:has(#tela-estudio.active) #hero-perfil:not([hidden]){display:grid!important}
.pm-tampo:has(#tela-estudio.active){opacity:0!important;pointer-events:none!important}

/* com o menu aberto o documento de trás (a mesa original, invisível) não pode rolar */

/* menu sem rolar a página fora do PC: texto e carreira em cima, modos num carrossel de arrastar que ocupa o resto */
@media (max-width:1100px){
  #hero-menu{display:flex!important;flex-direction:column;gap:12px;overflow:hidden!important;padding-bottom:14px}
  .hm-esq{flex:none;justify-content:flex-start;gap:10px}

  .hm-modos{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:46%;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:2px}
  .hm-modos::-webkit-scrollbar{display:none}
  .hm-modo{min-height:0!important;scroll-snap-align:start}
  .hm-modo h2{font-size:clamp(30px,4.6vh,48px)}
}
@media (max-width:760px){
  .hm-esq p{display:none}
  .hm-eyb{font-size:11px;letter-spacing:3px}

  .hs-top{grid-template-columns:44px minmax(0,1fr) auto;gap:10px}.hs-top .hs-esc,.hs-top .hs-ini{width:44px;height:44px}
  .hs-meta{padding-top:7px;font-size:12px}.hs-meta b{font-size:18px}

  .hs-id small{letter-spacing:2px}

@media (max-width:760px){.hs-id b{font-size:27px}.hs-ovr b{font-size:32px}.hs-conf{grid-template-columns:1fr 1fr}.hs-conf p{grid-column:1/-1}.hs-lista{max-height:min(16vh,118px)}}

          const g = el.querySelector('.hm-modos'); if (!g) return;
          const cs = [...g.querySelectorAll('.hm-modo')]; if (!cs.length) return;
          const x0 = cs[0].offsetLeft;
          let i = 0, melhor = Infinity;
          cs.forEach((c, k) => { const d = Math.abs((c.offsetLeft - x0) - g.scrollLeft); if (d < melhor) { melhor = d; i = k; } });
          const alvo = cs[Math.max(0, Math.min(cs.length - 1, i + Number(sb.dataset.seta)))];
          deslizaPara(g, alvo.offsetLeft - x0);
          return;
        }
        const b = e.target.closest('[data-hm]'); if (!b) return;
        const k = b.dataset.hm;
        if (k === 'embreve') return;
        if (acaoSaves(k)) { assinMenu = ''; menu(); return; }
        if (k === 'bastidores') {
            if (window.Promessa && window.Promessa.ehConvidado && window.Promessa.ehConvidado()) {
              location.href = 'conta/login.html?next=' + encodeURIComponent('inicio_online.html') + '&motivo=bastidores_requer_conta';
              return;
            }
            location.href = 'inicio_online.html';
            return;
          }
        if (k === 'ultimate') {
            if (window.Promessa && window.Promessa.ehConvidado && window.Promessa.ehConvidado()) {
              location.href = 'conta/login.html?next=' + encodeURIComponent('cartas/index.html') + '&motivo=ultimate_requer_conta';
              return;
            }
            location.href = 'cartas/index.html';
            return;
          }
        if (k === 'save') proxy('.pm-saves-bar .btn-acao-h'); else proxy('a.card-hero-m.' + k);
      });
      document.body.appendChild(el);
    }
    const s = salvo(), assin = s.vazio + '|' + s.txt + '|' + (localStorage.getItem('futx-saves') || '') + '|' + hsConf + '|' + idAtivo(lerIndice());
    if (assin !== assinMenu || el.hidden) { el.innerHTML = htmlMenu(); assinMenu = assin; ligaSetas(el); }
    el.hidden = false;
    atualizaSetas(el);
  }


  /* ---------- perfil e biótipo: camada com o layout do teste ---------- */
  const POSI = { ATA: [50, 12], SA: [50, 24], PE: [18, 18], PD: [82, 18], MEI: [50, 38], ME: [16, 46], MD: [84, 46], MC: [50, 52], VOL: [50, 64], LE: [14, 74], ZAE: [36, 80], ZAD: [64, 80], LD: [86, 74], GOL: [50, 94] };
  const $o = (sel) => document.querySelector('#tela-estudio ' + sel);
  function selPorRotulo(rx) {
    const l = [...document.querySelectorAll('#tela-estudio label')].find((x) => rx.test(x.textContent.trim()));
    return l ? l.parentElement.querySelector('select') : null;
  }
  /* escreve no campo do jogo do jeito que o runtime enxerga (setter nativo + eventos) */
  function escrever(el, v) {
    if (!el) { console.warn('[hero-ui] campo original da criação não encontrado'); return; }
    const proto = el.tagName === 'SELECT' ? HTMLSelectElement.prototype : HTMLInputElement.prototype;
    const d = Object.getOwnPropertyDescriptor(proto, 'value');
    if (d && d.set) d.set.call(el, v); else el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  const opcoesDe = (s) => s ? [...s.options].map((o) => `<option value="${esc(o.value)}">${esc(o.textContent.trim())}</option>`).join('') : '';
  function htmlPerfil() {
    const nac = selPorRotulo(/^nacionalidade$/i), con = selPorRotulo(/^continente$/i), liga = selPorRotulo(/^liga$/i);
    const pitch = Object.entries(POSI).map(([k, [x, y]]) => `<button type="button" data-hp-pos="${k}" style="left:${x}%;top:${y}%" aria-pressed="false">${k}</button>`).join('');
    return `<div><span class="hp-eyb">Criar craque</span><h1 class="hp-h1">Perfil e <em>biótipo</em></h1></div>
      <div class="hp-grade">
        <div class="hp-pn"><h3>Seu atleta <small>Físico</small></h3><div class="hp-cp">
          <div class="hp-campo"><label for="hp-nome">Nome</label><input id="hp-nome" autocomplete="off" maxlength="20" placeholder="Nome"><span class="msg" id="hp-nome-msg" role="alert"></span></div>
          <div class="hp-campo"><label for="hp-sob">Sobrenome</label><input id="hp-sob" autocomplete="off" maxlength="20" placeholder="Sobrenome"></div>
          <div class="hp-campo"><label for="hp-nac">Nacionalidade</label><select id="hp-nac">${opcoesDe(nac)}</select></div>
          <div class="hp-campo"><label for="hp-num">Nº camisa</label><input id="hp-num" type="number" min="1" max="99" inputmode="numeric"></div>
          ${con ? `<div class="hp-campo"><label for="hp-con">Continente</label><select id="hp-con">${opcoesDe(con)}</select></div>` : ''}
          ${liga ? `<div class="hp-campo"><label for="hp-liga">Liga</label><select id="hp-liga">${opcoesDe(liga)}</select></div>` : ''}
          <div class="hp-campo full"><span class="lb" id="hp-bio-rot">Biótipo</span><div class="hp-bio" id="hp-bio"></div></div>
          <div class="hp-campo full"><label for="hp-alt">Altura</label><div class="hp-rng"><input id="hp-alt" type="range"><b id="hp-v-alt"></b></div></div>
          <div class="hp-campo full"><label for="hp-pes">Peso</label><div class="hp-rng"><input id="hp-pes" type="range"><b id="hp-v-pes"></b></div></div>
          <div class="hp-campo"><span class="lb">Pé preferencial</span><div class="hp-seg2"><button type="button" data-hp-pe="Destro" aria-pressed="false">Destro</button><button type="button" data-hp-pe="Canhoto" aria-pressed="false">Canhoto</button></div></div>
          <div class="hp-campo"><span class="lb">Pé fraco</span><div class="hp-estrelas" id="hp-pf"></div></div>
        </div></div>
        <div class="hp-meio"><small>Prévia do card</small><div class="hp-carta" id="hp-carta"></div></div>
        <div class="hp-pn"><h3>Posição em campo <small id="hp-pos-rot"></small></h3><div class="hp-pitch" id="hp-pitch"><span class="area t"></span><span class="area b"></span>${pitch}</div>
          <div class="hp-arq"><small>Arquétipo tático da posição</small><select id="hp-arq" aria-label="Arquétipo tático"></select><p id="hp-arq-d"></p></div></div>
      </div>
      <div class="hp-rod"><button type="button" class="hp-cta sec" data-hp="voltar">← Voltar</button><button type="button" class="hp-cta" data-hp="avancar" id="hp-avancar">Distribuir atributos ▸</button></div>`;
  }
  const ultimo = {};
  const pressed = (b, on) => { const v = String(on); if (b.getAttribute('aria-pressed') !== v) b.setAttribute('aria-pressed', v); };
  function setSe(id, prop, v) { const el = document.getElementById(id); if (!el || document.activeElement === el) return; if (el[prop] !== v) el[prop] = v; }
  function htmlSe(id, h) { if (ultimo[id] === h) return; const el = document.getElementById(id); if (el) { el.innerHTML = h; ultimo[id] = h; } }
  function sincronizarPerfil() {
    const nome = $o('#in-nome'), sob = $o('#in-sobrenome'), num = $o('#in-camisa'), alt = $o('#slider-alt'), pes = $o('#slider-pes');
    if (nome) setSe('hp-nome', 'value', nome.value);
    if (sob) setSe('hp-sob', 'value', sob.value);
    if (num) setSe('hp-num', 'value', num.value);
    [['hp-nac', selPorRotulo(/^nacionalidade$/i)], ['hp-con', selPorRotulo(/^continente$/i)], ['hp-liga', selPorRotulo(/^liga$/i)]].forEach(([id, s]) => { if (s) setSe(id, 'value', s.value); });
    [['hp-alt', alt], ['hp-pes', pes]].forEach(([id, s]) => { const el = document.getElementById(id); if (!s || !el) return; if (el.min !== s.min) el.min = s.min; if (el.max !== s.max) el.max = s.max; if (el.step !== (s.step || '1')) el.step = s.step || '1'; setSe(id, 'value', s.value); });
    const ta = $o('#txt-val-alt'), tp = $o('#txt-val-pes');
    htmlSe('hp-v-alt', esc(ta ? ta.textContent.trim() : (alt ? (alt.value / 100).toFixed(2).replace('.', ',') + ' m' : '')));
    htmlSe('hp-v-pes', esc(tp ? tp.textContent.trim() : (pes ? pes.value + ' kg' : '')));
    const rot = $o('#bio-rotulo-biotipo'), res = $o('#bio-resumo-tags');
    htmlSe('hp-bio-rot', 'Biótipo · ' + esc(rot ? rot.textContent.trim() : '') + (res && res.textContent.trim() ? ' · ' + esc(res.textContent.trim()) : ''));
    htmlSe('hp-bio', [...document.querySelectorAll('#bio-impactos-dinamicos .bio-imp')].map((s) => {
      const b = s.querySelector('b'), n = b ? parseInt(b.textContent, 10) || 0 : 0, nomeA = s.textContent.replace(b ? b.textContent : '', '').trim();
      return `<span class="${n > 0 ? '' : n < 0 ? 'neg' : 'zero'}">${n ? (n > 0 ? '+' : '') + n + ' ' : ''}${esc(nomeA)}</span>`;
    }).join(''));
    const destro = $o('#btn-pe-destro'), pe = destro && destro.classList.contains('active') ? 'Destro' : 'Canhoto';
    document.querySelectorAll('#hero-perfil [data-hp-pe]').forEach((b) => pressed(b, b.dataset.hpPe === pe));
    const pf = document.querySelectorAll('#stars-selector .star-item.ativa').length, pfd = $o('#txt-pe-fraco-desc');
    htmlSe('hp-pf', [1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= pf ? 'on' : ''}" data-hp-pf="${n}" aria-label="Pé fraco ${n} de 5">★</button>`).join('') + (pfd ? `<small>${esc(pfd.textContent.trim())}</small>` : ''));
    const pin = $o('.pitch-pin.active'), pos = pin ? pin.dataset.pos : '';
    document.querySelectorAll('#hp-pitch [data-hp-pos]').forEach((b) => pressed(b, b.dataset.hpPos === pos));
    htmlSe('hp-pos-rot', esc(pos));
    const sa = $o('#select-arquetipo');
    if (sa) { htmlSe('hp-arq', opcoesDe(sa)); setSe('hp-arq', 'value', sa.value); }
    const da = $o('#txt-desc-arquetipo'); htmlSe('hp-arq-d', esc(da ? da.textContent.trim() : ''));
    const cc = document.querySelector('#main-card-slot .cc-estudio');
    htmlSe('hp-carta', cc ? cc.innerHTML : '');
    const av = document.getElementById('hp-avancar'), rotAv = caminhoPeneira() ? 'Ir para a peneira ▸' : 'Distribuir atributos ▸';
    if (av && av.textContent !== rotAv) av.textContent = rotAv;
    if (nome && nome.value.trim()) { const i = document.getElementById('hp-nome'), m = document.getElementById('hp-nome-msg'); if (i && i.classList.contains('erro')) i.classList.remove('erro'); if (m && m.textContent) m.textContent = ''; }
  }
  const caminhoPeneira = () => document.documentElement.dataset.caminho === 'peneira';
  function cliqueOriginal(sel) { const el = $o(sel); if (el) el.click(); else console.warn('[hero-ui] botão original não encontrado:', sel); }
  function perfil() {
    const ativo = visivel(document.querySelector('#tela-estudio.active'));
    let el = document.getElementById('hero-perfil');
    document.documentElement.classList.toggle('hero-perfil', ativo);
    if (!ativo) { if (el) el.hidden = true; return; }
    if (!el) {
      el = document.createElement('section'); el.id = 'hero-perfil'; el.setAttribute('aria-label', 'Perfil e biótipo'); el.innerHTML = htmlPerfil();
      el.addEventListener('input', (e) => {
        const id = e.target.id, mapa = { 'hp-nome': '#in-nome', 'hp-sob': '#in-sobrenome', 'hp-num': '#in-camisa', 'hp-alt': '#slider-alt', 'hp-pes': '#slider-pes' };
        if (mapa[id]) escrever($o(mapa[id]), e.target.value);
      });
      el.addEventListener('change', (e) => {
        const id = e.target.id;
        if (id === 'hp-nac') escrever(selPorRotulo(/^nacionalidade$/i), e.target.value);
        else if (id === 'hp-con') escrever(selPorRotulo(/^continente$/i), e.target.value);
        else if (id === 'hp-liga') escrever(selPorRotulo(/^liga$/i), e.target.value);
        else if (id === 'hp-arq') escrever($o('#select-arquetipo'), e.target.value);
        else return;
        setTimeout(sincronizarPerfil, 30);
      });
      el.addEventListener('click', (e) => {
        const p = e.target.closest('[data-hp-pos]'), pe = e.target.closest('[data-hp-pe]'), pf = e.target.closest('[data-hp-pf]'), a = e.target.closest('[data-hp]');
        if (p) cliqueOriginal(`.pitch-pin[data-pos="${p.dataset.hpPos}"]`);
        else if (pe) cliqueOriginal(pe.dataset.hpPe === 'Destro' ? '#btn-pe-destro' : '#btn-pe-canhoto');
        else if (pf) cliqueOriginal(`#stars-selector [data-val="${pf.dataset.hpPf}"]`);
        else if (a && a.dataset.hp === 'voltar') { if (typeof window.trocarTela === 'function') window.trocarTela('tela-escolha'); else console.warn('[hero-ui] trocarTela indisponível'); }
        else if (a && a.dataset.hp === 'avancar') {
          const n = $o('#in-nome');
          if (!n || !n.value.trim()) { const i = document.getElementById('hp-nome'), m = document.getElementById('hp-nome-msg'); if (i) { i.classList.add('erro'); i.focus(); } if (m) m.textContent = 'Digite o nome do atleta para seguir'; return; }
          if (caminhoPeneira()) {
            if (typeof window.concluirCriacao === 'function') window.concluirCriacao(); else console.error('[hero-ui] concluirCriacao indisponível: não deu para abrir a peneira');
          } else cliqueOriginal('.btn-avancar-skills');
        } else return;
        setTimeout(sincronizarPerfil, 30);
      });
      document.body.appendChild(el);
      Object.keys(ultimo).forEach((k) => delete ultimo[k]);
    }
    if (el.hidden) Object.keys(ultimo).forEach((k) => delete ultimo[k]);
    el.hidden = false;
    sincronizarPerfil();
  }

  /* ---------- atributos: título, Limpar e rótulos do teste ---------- */
  function atributos() {
    if (!document.querySelector('#tela-skills.active')) return;
    const t = document.querySelector('#tela-skills .skills-title');
    if (t) {
      t.childNodes.forEach((n) => { if (n.nodeType === 3 && n.textContent.includes(':')) n.textContent = n.textContent.replace(':', ''); });
      const s = t.querySelector('span'); if (s && /\s\([A-Z]{2,3}\)\s*$/.test(s.textContent)) s.textContent = s.textContent.replace(/\s\([A-Z]{2,3}\)\s*$/, '');
    }
    const rod = document.querySelector('#tela-skills .skills-footer-actions');
    if (!rod) return;
    const fim = rod.querySelector('[data-action="concluir-craque"]');
    if (fim && !/^Concluir criação ▸$/.test(fim.textContent.trim())) fim.textContent = 'Concluir criação ▸';
    const volta = rod.querySelector('[data-target="tela-estudio"]');
    if (volta && !/^← Voltar ao biótipo$/.test(volta.textContent.trim())) volta.textContent = '← Voltar ao biótipo';
    if (fim && !document.getElementById('hero-limpar')) {
      const b = document.createElement('button'); b.type = 'button'; b.id = 'hero-limpar'; b.className = 'btn-escolha-cta btn-sec'; b.style.cssText = 'width:auto;padding:12px 24px'; b.textContent = 'Limpar';
      b.addEventListener('click', limpar); rod.insertBefore(b, fim);
    }
  }
  /* o jogo põe "Silva" quando o sobrenome fica vazio: aqui o vazio continua vazio */
  function semSobrenomePadrao() {
    if (typeof window.concluirCriacao !== 'function' || window.concluirCriacao.__heroSob) return;
    const prev = window.concluirCriacao;
    const nova = function () {
      const s = document.getElementById('in-sobrenome');
      const vazio = !!s && !s.value.trim();
      let e = null; try { e = estado; } catch (err) { e = null; }
      if (!vazio) return prev.apply(this, arguments);
      const dono = Object.getOwnPropertyDescriptor(s, 'value');
      Object.defineProperty(s, 'value', { configurable: true, get: () => '', set: () => {} });
      if (e) e.sobrenome = '';
      try { return prev.apply(this, arguments); }
      finally {
        if (dono) Object.defineProperty(s, 'value', dono); else delete s.value;
        if (e) e.sobrenome = '';
        try { const k = 'promessa-novo-craque', p = JSON.parse(localStorage.getItem(k) || 'null'); if (p && p.sobrenome === 'Silva') { p.sobrenome = ''; localStorage.setItem(k, JSON.stringify(p)); } }
        catch (err) { console.warn('[hero-ui] não deu para limpar o sobrenome salvo:', err); }
      }
    };
    nova.__heroSob = true;
    window.concluirCriacao = nova;
    try { concluirCriacao = nova; } catch (err) { /* binding global já é a propriedade da janela */ }
  }
  if (typeof window.atualizarEstudio === 'function') {
    window.atualizarEstudio = function () {
      let e = null; try { e = estado; } catch (err) { return; }
      const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
      e.nome = v('in-nome'); e.sobrenome = v('in-sobrenome'); e.numeroCamisa = parseInt(v('in-camisa'), 10) || 10;
      try { renderizarCardPrincipal(); } catch (err) { console.error('[hero-ui] carta:', err); }
    };
  }
  function limpar() {
    let e = null; try { e = estado; } catch (err) { console.error('[hero-ui] estado da criação indisponível:', err); return; }
    const H = window.PromessaHab;
    if (!e || !e.atributosBase || !H || !H.CRIACAO) { console.warn('[hero-ui] não deu para limpar: dados da criação ausentes'); return; }
    e.atributos = Object.assign({}, e.atributosBase); e.pontosDisponiveis = H.CRIACAO.orcamento;
    try { recalcularOverall(); renderizarCardPrincipal(); renderizarClustersHabilidades(); } catch (err) { console.error('[hero-ui] falha ao redesenhar após limpar:', err); }
  }

  /* ---------- etapas da criação ---------- */
  const PASSOS = ['Início', 'Perfil', 'Atributos', 'Clube', 'Contrato'];
  const PASSOS_PENEIRA = ['Início', 'Perfil', 'Peneira', 'Clube', 'Contrato'];
  function etapaAtual() {
    if (visivel(document.querySelector('#tela-escolha.active'))) return 0;
    if (visivel(document.querySelector('#tela-estudio.active'))) return 1;
    if (visivel(document.querySelector('#tela-skills.active'))) return 2;
    const f = document.querySelector('iframe[src*="peneira_2d"]'); if (visivel(f)) return 3;
    return null;
  }
  let etapaAnt = -2;
  function passos() {
    const i = etapaAtual();
    let nav = document.getElementById('hero-passos');
    if (i == null) { if (nav) nav.hidden = true; etapaAnt = -2; return; }
    if (!nav) { nav = document.createElement('nav'); nav.id = 'hero-passos'; nav.setAttribute('aria-label', 'Etapas da criação'); document.body.appendChild(nav); }
    const pen = !!document.querySelector('iframe[src*="peneira_2d"]') || document.documentElement.dataset.caminho === 'peneira';
    const lista = pen ? PASSOS_PENEIRA : PASSOS, idx = pen && i === 3 ? 2 : i;
    const chave = idx + (pen ? 'p' : '');
    if (chave !== etapaAnt) { nav.innerHTML = lista.map((p, k) => { const i = idx; return  `<span class="${k < i ? 'ok' : k === i ? 'on' : ''}"${k === i ? ' aria-current="step"' : ''}><b>${k + 1}</b>${p}</span>`; }).join(''); etapaAnt = chave; }
    nav.hidden = false;
  }

  function fundo() {
    const alvo = document.querySelector('#tela-escolha.active, #tela-estudio.active, #tela-skills.active') || document.querySelector('iframe[src*="peneira_2d"]');
    const ativo = visivel(alvo) || !!document.querySelector('#tela-estudio.active');
    const h = document.documentElement;
    if (h.classList.contains('hero-cria') !== ativo) h.classList.toggle('hero-cria', ativo);
    if (!ativo) return;
    for (let e = alvo && alvo.parentElement; e && e !== document.body; e = e.parentElement) {
      if (e.classList.contains('hero-fundo-limpo')) continue;
      const st = getComputedStyle(e);
      if (st.backgroundImage !== 'none' || st.backgroundColor !== 'rgba(0, 0, 0, 0)') e.classList.add('hero-fundo-limpo');
    }
  }
  const LOGO_PROMESSA = 'assets/logo_goat_oficial.jpg';
  function dashboard() {
    document.querySelectorAll('.ih-trilho img.logo').forEach((im) => { if (!im.src.endsWith(LOGO_PROMESSA)) { im.src = LOGO_PROMESSA; im.classList.add('hero-logo'); } });
    document.querySelectorAll('.futx-wrap:not([data-hero-visto])').forEach((w) => {
      w.dataset.heroVisto = '1';
      const r = w.querySelector('#ih-raiz');
      if (r && !r.children.length) { w.classList.add('hero-espera'); setTimeout(() => w.classList.remove('hero-espera'), 700); }
    });
    document.querySelectorAll('.futx-wrap.hero-espera').forEach((w) => { const r = w.querySelector('#ih-raiz'); if (r && r.children.length) w.classList.remove('hero-espera'); });
  }
  function opcoes() { document.querySelectorAll('#tela-escolha .esc-card').forEach((c, i) => { if (!c.dataset.opcao) c.dataset.opcao = 'Opção ' + 'AB'[i]; }); }
  function tick() { try { menu(); perfil(); atributos(); opcoes(); fundo(); dashboard(); } catch (err) { console.error('[hero-ui] falha ao atualizar a tela:', err); } }
  function iniciar() {
    estilo(); semSobrenomePadrao(); tick(); setInterval(tick, 300);
    /* troca de tela do jogo (classe active, nós novos) dispara o tick no próximo quadro, sem esperar o intervalo */
    let pend = false;
    new MutationObserver(() => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; tick(); }); })
      .observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
    /* caminho escolhido (para a etapa 4 dizer "Peneira" já no perfil) */
    document.addEventListener('click', (e) => { const c = e.target.closest('#tela-escolha .esc-card'); if (c) document.documentElement.dataset.caminho = c.dataset.action === 'peneira' ? 'peneira' : 'craque'; }, true);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
  window.PromessaHeroUI = { tick, limpar };
})();

</script>
