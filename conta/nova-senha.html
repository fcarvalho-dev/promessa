<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROMESSA · Nova senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04100a; --panel:#0C2417; --border:#1F5138; --dim:#8FB09C;
    --branco:#FFF8EA; --ouro:#E8B84B; --verde:#00FF87; --rosa:#FF2E5B;
    --f-disp:'Outfit'; --f-corpo:'Montserrat'; --f-mono:'Share Tech Mono';
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--branco);font-family:var(--f-corpo),sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
  #fundo{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%, #0d2c1c, #04100a 70%)}
  #fundo::after{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
    width:520px;height:300px;background:radial-gradient(ellipse, rgba(0,255,135,.12), transparent 70%)}
  .crest{filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
  .wrap{position:relative;width:100%;max-width:330px}

  .carta{border-radius:22px;padding:22px 20px;position:relative;overflow:hidden;
    background:repeating-linear-gradient(60deg, rgba(255,255,255,.02) 0 1px, transparent 1px 11px),
      radial-gradient(ellipse at 50% 12%, #0B331E, #04140B 60%, #010703);
    border:2px solid var(--verde);box-shadow:0 24px 60px rgba(0,0,0,.9), 0 0 34px rgba(0,255,135,.2)}
  .carta::after{content:'';position:absolute;inset:10px;border:1px dashed rgba(0,255,135,.22);border-radius:15px;pointer-events:none}

  .topo{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid rgba(0,255,135,.22);padding-bottom:9px;position:relative}
  .topo .marca{display:flex;align-items:center;gap:8px}
  .topo .marca b{font-family:var(--f-disp);font-weight:900;font-style:italic;letter-spacing:2px;font-size:15px}
  .topo .tag{font-family:var(--f-mono);font-size:8.5px;color:var(--dim);letter-spacing:1px}

  .hero{text-align:center;padding:16px 0 12px;position:relative}
  .hero .stars{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:.8;color:#fff;text-shadow:0 0 14px rgba(0,255,135,.4)}
  .hero .titulo{font-family:var(--f-disp);font-weight:800;font-style:italic;font-size:17px;color:var(--verde);letter-spacing:1px;margin-top:6px}
  .hero .sub{font-family:var(--f-mono);font-size:9.5px;color:var(--dim);letter-spacing:3px;margin-top:4px}

  form{display:flex;flex-direction:column;gap:10px;position:relative}
  label span{display:block;font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
  input{width:100%;background:rgba(6,16,9,.72);border:1px solid var(--border);border-radius:10px;
    padding:11px 13px;color:var(--branco);font-family:var(--f-corpo);font-size:14px;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--verde)}
  .btn{width:100%;border:none;border-radius:10px;padding:12px;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.5px;cursor:pointer;transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.verde{background:var(--verde);color:#04120a}
  .btn.ouro{background:linear-gradient(180deg,var(--ouro),#c99a2e);color:#231704}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--border);font-weight:600;font-size:14px}
  .btn.google{background:#fff;color:#1a1a1a;font-family:var(--f-corpo);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px}
  .divisor{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;letter-spacing:1px;margin:2px 0}
  .divisor span{flex:1;height:1px;background:var(--border)}
  .rodape{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);padding-top:8px;margin-top:12px;
    font-family:var(--f-mono);font-size:8px;color:var(--dim);letter-spacing:1px;position:relative}
  .troca{text-align:center;color:var(--dim);font-size:12.5px;margin-top:12px;position:relative}
  .troca a{color:var(--ouro);font-weight:700;cursor:pointer;text-decoration:none}
  .msg{min-height:17px;text-align:center;font-size:12px;margin-top:2px;position:relative}
  .msg.erro{color:var(--rosa)} .msg.ok{color:var(--verde)}
  .hide{display:none !important}
  .esqueci{text-align:right;margin-top:-4px}
  .esqueci a{color:var(--dim);font-size:11px;cursor:pointer}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(4,18,10,.3);border-top-color:#04120a;border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px}
  @keyframes g{to{transform:rotate(360deg)}}
  .logo-hero{display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:18px;object-fit:cover;box-shadow:0 8px 28px rgba(0,0,0,.55),0 0 0 1px rgba(232,184,75,.4)}
</style>
<meta name="theme-color" content="#061009"><link rel="stylesheet" href="/comum/ui-promessa.css"><script type="module" src="/comum/promessa-boot.js"></script>
</head>
<body>
<div id="fundo"></div>
<div class="wrap">
  <div class="carta">
    <div class="topo">
      <div class="marca"><img class="crest" src="../assets/logo_goat_oficial.jpg" alt="" width="34" height="34" style="border-radius:8px;object-fit:cover"><b>PROMESSA</b></div>
      <span class="tag">NOVA SENHA</span>
    </div>
    <div class="hero"><img class="logo-hero" src="../assets/logo_goat_oficial.jpg" alt="PROMESSA"><div class="titulo">CRIE SUA NOVA SENHA</div><div class="sub">DEPOIS É SÓ ENTRAR E JOGAR</div></div>
    <form id="formNova" class="hide" autocomplete="on">
      <label><span>Nova senha</span><input id="senha1" type="password" placeholder="mínimo 8 caracteres" autocomplete="new-password" minlength="8" required></label>
      <label><span>Repita a senha</span><input id="senha2" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required></label>
      <button class="btn verde" id="btSalvar" type="submit">SALVAR SENHA</button>
    </form>
    <div class="msg" id="msg">Validando o link…</div>
    <div class="troca"><a href="login.html">Voltar para o login</a></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="escudo" viewBox="0 0 120 140">
    <path d="M60 4 L112 24 V72 C112 104 90 126 60 136 C30 126 8 104 8 72 V24 Z" fill="url(#gesc)" stroke="#E8B84B" stroke-width="3"/>
    <path d="M60 14 L103 30 V72 C103 99 85 118 60 127 C35 118 17 99 17 72 V30 Z" fill="none" stroke="rgba(232,184,75,.35)" stroke-width="1.5"/>
    <text x="60" y="92" font-family="Outfit,sans-serif" font-weight="900" font-size="68" fill="#E8B84B" text-anchor="middle" font-style="italic">P</text>
    <path d="M60 22 l4.2 8.6 9.5 1.4 -6.9 6.7 1.6 9.4 -8.5 -4.5 -8.5 4.5 1.6 -9.4 -6.9 -6.7 9.5 -1.4 Z" fill="#00FF87" opacity=".9"/>
    <linearGradient id="gesc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123B28"/><stop offset="1" stop-color="#061009"/></linearGradient>
  </symbol>
</defs></svg>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="nova-senha.js?v=20261025"></script>
</body>
</html>
