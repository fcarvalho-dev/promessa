<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261022">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon.png?v=20261022">
<link rel="shortcut icon" href="/favicon.ico?v=20261022">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20261022">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROMESSA — J × J</title>
<!-- JXJ-2: página do J × J 2.0 (tema Hero, direção B). O montador só embute o logo; não aplica a pele antiga. -->
<style>
@font-face{font-family:'Teko';font-weight:500;src:url('fontes/teko-500.woff2') format('woff2')}
@font-face{font-family:'Teko';font-weight:600;src:url('fontes/teko-600.woff2') format('woff2')}
@font-face{font-family:'Teko';font-weight:700;src:url('fontes/teko-700.woff2') format('woff2')}
@font-face{font-family:'Rajdhani';font-weight:500;src:url('fontes/rajdhani-500.woff2') format('woff2')}
@font-face{font-family:'Rajdhani';font-weight:600;src:url('fontes/rajdhani-600.woff2') format('woff2')}
@font-face{font-family:'Rajdhani';font-weight:700;src:url('fontes/rajdhani-700.woff2') format('woff2')}
:root{
  --bg:#040908;--bg2:#07100e;--pn:rgba(9,16,15,.92);--pn2:rgba(255,255,255,.035);
  --ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.18);
  --br:#F2F7F4;--dim:rgba(242,247,244,.6);--dim2:rgba(242,247,244,.38);
  --modo:#4DA3FF;--ouro:#E8B84B;--der:#FF5A6A;--ok:#00FF87;
  --j1:#00FF87;--j1-rgb:0,255,135;--j2:#FF8A1F;--j2-rgb:255,138,31;
  --on1:#03140b;--on2:#1c0d02;
  --s-gol:#FFD24A;--s-def:#5AA8FF;--s-mei:#00FF87;--s-ata:#FF7A5C;
  --cut:18px;
}
body.dirB{--j1:#4DA3FF;--j1-rgb:77,163,255;--j2:#FF5A6A;--j2-rgb:255,90,106;--on1:#03101f;--on2:#22060a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--br);
  font:600 15px/1.35 'Rajdhani','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--modo);outline-offset:2px}
img{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- palco ---------- */
#st{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(900px 480px at 0% 0%,rgba(var(--j1-rgb),.08),transparent 60%),
             radial-gradient(900px 480px at 100% 0%,rgba(var(--j2-rgb),.08),transparent 60%),var(--bg)}
body.dirB #st{background:radial-gradient(1200px 520px at 50% -10%,rgba(77,163,255,.10),transparent 60%),var(--bg)}

/* cabeçalho A: arena dividida */
.hdA{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px clamp(14px,2.4vw,36px) 10px}
.pl{display:flex;align-items:center;gap:12px;min-width:0}
.pl.d{justify-content:flex-end;text-align:right}
.pl .bar{width:6px;align-self:stretch;background:var(--c);box-shadow:0 0 14px var(--c)}
.pl small{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim2)}
.pl b{display:block;font:700 30px/.9 'Teko',sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pts{font:700 34px/1 'Teko',sans-serif;color:var(--br);padding:0 4px}
.vs{display:flex;flex-direction:column;align-items:center;gap:2px}
.vs .x{font:700 34px/.8 'Teko',sans-serif;letter-spacing:2px}
.vs .x i{font-style:normal;color:var(--modo)}
.vs small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
/* cabeçalho B: transmissão */
.hdB{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,2.4vw,36px) 10px}
.marca{display:flex;align-items:center;gap:10px;font:700 24px/1 'Teko',sans-serif;letter-spacing:1px;text-transform:uppercase}
.marca i{font-style:normal;color:var(--modo)}
.marca .nmj{font:inherit;letter-spacing:inherit;color:inherit}
.marca span:not(.nmj){font:600 11px/1 'Rajdhani',sans-serif;letter-spacing:3px;color:var(--dim2)}
.bug{display:flex;align-items:stretch;height:40px;background:#0b1316;border:1px solid var(--ln2);
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.bug .t{display:flex;align-items:center;gap:8px;padding:0 14px;font:700 22px/1 'Teko',sans-serif;text-transform:uppercase;letter-spacing:1px}
.bug .t.a{background:var(--j1);color:var(--on1);padding-left:20px}
.bug .t.b{background:var(--j2);color:var(--on2);padding-right:20px}
.bug .m{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 14px;min-width:96px}
.bug .m b{font:700 22px/1 'Teko',sans-serif;letter-spacing:2px}
.bug .m small{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim)}
.hdB .fase{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}

.corpo{flex:1;min-height:0;padding:0 clamp(14px,2.4vw,36px) clamp(12px,2vh,22px);display:grid;gap:14px}
.rola{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;min-height:0}

/* painel angular */
.pn{position:relative;background:var(--pn);border:1px solid var(--ln);padding:16px;min-height:0;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.pn h3,.h3{margin:0 0 10px;font:600 13px/1 'Rajdhani',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.h3 b{color:var(--br)}
.novo{display:inline-block;margin-left:6px;padding:2px 7px 1px;font:700 10px/1.2 'Rajdhani',sans-serif;letter-spacing:2px;color:#000;background:var(--modo);vertical-align:2px;
  clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;white-space:nowrap;padding:0 26px;background:var(--modo);color:#03101f;
  font:700 24px/1 'Teko',sans-serif;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 0 26px rgba(77,163,255,.35);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.cta.c1{background:var(--j1);color:var(--on1);box-shadow:0 0 26px rgba(var(--j1-rgb),.35)}
.cta.c2{background:var(--j2);color:var(--on2);box-shadow:0 0 26px rgba(var(--j2-rgb),.35)}
.sec{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border:1px solid var(--ln2);
  font:600 20px/1 'Teko',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border:1px solid var(--ln2);font:600 19px/1 'Teko',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.chip[aria-pressed=true]{background:var(--modo);border-color:var(--modo);color:#03101f}
.chip small{display:block;font:600 11px/1 'Rajdhani',sans-serif;letter-spacing:1px;text-transform:none;opacity:.75}
.op{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px}
.op button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border:1px solid var(--ln2);text-align:left;min-width:0}
.op button b{font:700 21px/1 'Teko',sans-serif;letter-spacing:1px;text-transform:uppercase}
.op button span{font-size:12.5px;color:var(--dim);line-height:1.25}
.op button[aria-pressed=true]{border-color:var(--modo);background:rgba(77,163,255,.1)}
.op button[aria-pressed=true] b{color:var(--modo)}
.dica{font-size:13px;color:var(--dim);line-height:1.4}
.ico{width:18px;height:18px;flex:none}

/* posição */
.pos{flex:none;width:40px;text-align:center;padding:3px 0 2px;font:700 15px/1 'Teko',sans-serif;letter-spacing:1px;border:1px solid currentColor}
.pos.GOL{color:var(--s-gol)}.pos.DEF{color:var(--s-def)}.pos.MEI{color:var(--s-mei)}.pos.ATA{color:var(--s-ata)}
.pos i{display:block;font:600 9px/1 'Rajdhani',sans-serif;letter-spacing:0;opacity:.7;margin-top:1px;font-style:normal}

/* cartão de jogador */
.pc{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:var(--pn2);border:1px solid var(--ln);text-align:left;min-width:0}
.pc img{width:30px;height:30px;object-fit:contain}
.pc .nm{min-width:0;flex:1}
.pc .nm b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm span{display:block;font-size:12px;color:var(--dim2)}
.pc .f{font:700 26px/1 'Teko',sans-serif;font-variant-numeric:tabular-nums}
.pc.trava{border-color:var(--ouro);background:rgba(232,184,75,.08)}
.pc.desc{border-color:var(--der);background:rgba(255,90,106,.07)}
.pc.usa{border-color:rgba(var(--j-rgb),.6);background:rgba(var(--j-rgb),.07)}
.pc .mk{display:flex;align-items:center;gap:4px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.pc.trava .mk{color:var(--ouro)}.pc.desc .mk{color:var(--der)}
.setor{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim2)}
.setor:first-child{margin-top:0}
.setor::after{content:"";flex:1;height:1px;background:var(--ln)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}

/* ======== LOBBY ======== */
.lob{grid-template-columns:minmax(0,1fr) minmax(380px,520px)}
.heroimg{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:clamp(18px,3vw,36px)}
.heroimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.9)}
.heroimg::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,9,8,.05) 20%,rgba(4,9,8,.7) 60%,#040908)}
.heroimg{isolation:isolate}
.heroimg .eyb{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--modo)}
.heroimg .eyb::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--modo);box-shadow:0 0 10px var(--modo)}
.heroimg h1{margin:0;font:700 clamp(54px,9vh,100px)/.82 'Teko',sans-serif;text-transform:uppercase}
.heroimg h1 em{font-style:normal;color:var(--modo)}
.riv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:520px;padding:12px 16px;background:rgba(0,0,0,.55);border:1px solid var(--ln2);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.riv .n{font:700 22px/1 'Teko',sans-serif;text-transform:uppercase}
.riv .n.a{color:var(--j1)}.riv .n.b{color:var(--j2);text-align:right}
.riv .p{font:700 40px/1 'Teko',sans-serif;letter-spacing:2px;text-align:center}
.riv .rod{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim);border-top:1px solid var(--ln);padding-top:8px}
.cfg{display:flex;flex-direction:column;gap:14px}
.nomes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.nome{display:flex;align-items:center;gap:0;border:1px solid var(--ln2);background:rgba(0,0,0,.3)}
.nome i{width:6px;align-self:stretch;background:var(--c)}
.nome input{flex:1;min-width:0;height:46px;padding:0 12px;background:none;border:0;color:var(--c);font:700 24px/1 'Teko',sans-serif;text-transform:uppercase;letter-spacing:1px}
.liga{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--ln2)}
.liga img{width:34px;height:24px;object-fit:cover}
.liga b{display:block;font:700 22px/1 'Teko',sans-serif;text-transform:uppercase}
.liga span{font-size:12.5px;color:var(--dim)}
.liga .sec{margin-left:auto;height:34px;font-size:17px}

/* ======== DRAFT ======== */
.drf{grid-template-columns:240px minmax(0,1fr) 240px;grid-template-rows:auto minmax(0,1fr)}
.ordem{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ordem .o{width:34px;height:30px;display:grid;place-items:center;font:700 20px/1 'Teko',sans-serif;border:1px solid var(--ln2);color:var(--dim2)}
.ordem .o.a{color:var(--j1);border-color:rgba(var(--j1-rgb),.4)}.ordem .o.b{color:var(--j2);border-color:rgba(var(--j2-rgb),.4)}
.ordem .o.feito{opacity:.35}
.ordem .o.agora{background:var(--j2);color:var(--on2);border-color:var(--j2);box-shadow:0 0 14px rgba(var(--j2-rgb),.5)}
.picks{display:flex;flex-direction:column;gap:8px}
.picks .h3{color:var(--c)}
.slotc{display:flex;align-items:center;gap:10px;height:62px;padding:0 12px;border:1px solid var(--ln);background:var(--pn2)}
.slotc img{width:40px;height:40px;object-fit:contain}
.slotc b{font:700 21px/1 'Teko',sans-serif;text-transform:uppercase}
.slotc span{display:block;font-size:12px;color:var(--dim2)}
.slotc.vazio{border-style:dashed;justify-content:center;color:var(--dim2);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.picks .tot{margin-top:auto;font-size:12.5px;color:var(--dim)}
.clubes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.clube{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;border:1px solid var(--ln);background:var(--pn2);transition:border-color .2s,transform .2s}
.clube:hover{border-color:var(--j2);transform:translateY(-2px)}
.clube img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.clube b{font:700 20px/1 'Teko',sans-serif;text-transform:uppercase;text-align:center}
.clube .ov{font:700 16px/1 'Teko',sans-serif;letter-spacing:1px;color:var(--dim)}
.clube .ov b{font-size:20px;color:var(--br)}
.clube.tom{opacity:.28;pointer-events:none}
.clube .dono{position:absolute;top:6px;left:6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 6px;color:#000;background:var(--c)}
.clube .estr{position:absolute;top:6px;right:8px;display:flex;gap:2px}
.clube .estr i{width:6px;height:6px;transform:rotate(45deg);background:var(--ouro)}

/* ======== ROUBO ======== */
.rb{grid-template-columns:minmax(0,1fr) 320px}
.passo{display:flex;flex-direction:column;gap:12px}
.alvo{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln2);background:rgba(0,0,0,.3)}
.alvo .ic{width:42px;height:42px;display:grid;place-items:center;border:1px solid currentColor}
.alvo b{display:block;font:700 22px/1 'Teko',sans-serif;text-transform:uppercase}
.alvo span{font-size:12.5px;color:var(--dim)}
.alvo.t{color:var(--ouro)}.alvo.d{color:var(--der)}
.alvo.t b,.alvo.d b{color:var(--br)}
/* revelação */
.rev{grid-template-columns:1fr 1fr;align-items:center}
.carta{perspective:1200px;height:min(56vh,420px)}
.carta .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:vira 1s .3s both}
@keyframes vira{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.carta .fr,.carta .vs2{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:1px solid var(--ln2);
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.carta .vs2{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#0b1513 0 12px,#0e1a18 12px 24px)}
.carta .fr{background:linear-gradient(180deg,rgba(var(--c-rgb),.14),rgba(0,0,0,.6))}
.carta .quem{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--c)}
.carta .ped{font-size:14px;color:var(--dim)}
.carta .ped s{color:var(--br)}
.carta img{width:74px;height:74px;object-fit:contain}
.carta .lev{font:700 clamp(30px,5vh,46px)/.9 'Teko',sans-serif;text-transform:uppercase}
.carta .res{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font:700 18px/1 'Teko',sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.carta .res.tr{background:var(--ouro);color:#1a1003}.carta .res.ok{background:var(--c);color:#000}
.carta .f{font:700 44px/1 'Teko',sans-serif}

/* ======== PASSAR ======== */
.pas{place-items:center;text-align:center;position:relative;overflow:hidden}
.pas .cort{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(var(--c-rgb),.06) 0 2px,transparent 2px 60px),linear-gradient(180deg,rgba(var(--c-rgb),.10),transparent 70%)}
.pas .cx{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px}
.pas small{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--dim)}
.pas h2{margin:0;font:700 clamp(64px,13vh,140px)/.82 'Teko',sans-serif;text-transform:uppercase;color:var(--c);text-shadow:0 0 40px rgba(var(--c-rgb),.35)}
.pas p{margin:0;color:var(--dim);font-size:16px}
.segura{position:relative;width:min(340px,80vw);height:58px;border:1px solid var(--c);color:var(--c);font:700 24px/1 'Teko',sans-serif;letter-spacing:2px;text-transform:uppercase;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.segura i{position:absolute;left:0;top:0;bottom:0;width:38%;background:rgba(var(--c-rgb),.25)}
.segura span{position:relative}
.pas.B{background:#000}
.pas.B .cort{background:radial-gradient(600px 300px at 50% 50%,rgba(var(--c-rgb),.12),transparent 70%)}

/* ======== ESCALAÇÃO ======== */
.esc{grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr)}
.campo{position:relative;display:flex;flex-direction:column;justify-content:space-around;padding:14px 8px;border:1px solid rgba(var(--j-rgb),.22);min-height:0;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 9%,rgba(255,255,255,.0) 9% 18%),linear-gradient(180deg,#0a1714,#071210)}
.campo::before{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.08);border-radius:50%}
.campo::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.08)}
.campo .ar{position:absolute;left:30%;right:30%;height:12%;border:1px solid rgba(255,255,255,.08)}
.campo .ar.t{top:0;border-top:0}.campo .ar.b{bottom:0;border-bottom:0}
.lin{position:relative;z-index:1;display:flex;justify-content:space-evenly}
.vg{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:clamp(62px,9vw,96px)}
.vg .cam{position:relative;width:clamp(36px,5.4vh,52px);height:clamp(36px,5.4vh,52px)}
.vg .cam img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.vg .fz{position:absolute;right:-12px;top:-4px;min-width:26px;padding:1px 4px 0;background:#000;border:1px solid rgba(var(--j-rgb),.6);font:700 16px/1.1 'Teko',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.vg .fz.pen{border-color:var(--ouro);color:var(--ouro)}
.vg .nm{max-width:100%;padding:2px 6px 1px;background:rgba(0,0,0,.7);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg .ps{font-size:10px;letter-spacing:1.5px;color:var(--dim2)}
.vg .dots{display:flex;gap:3px;margin-top:2px}
.vg .dots i{width:6px;height:6px;transform:rotate(45deg);background:#1b2724;border:1px solid rgba(255,255,255,.2)}
.vg .dots i.c{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px var(--ok)}
.vg .dots i.m{background:var(--ouro);border-color:var(--ouro)}
.vg.vazia .cam{border:1.5px dashed rgba(var(--j-rgb),.45);display:grid;place-items:center;color:rgba(var(--j-rgb),.7);font:700 26px/1 'Teko',sans-serif}
.lado{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;min-height:0}
.forms{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.forms::-webkit-scrollbar{display:none}
.forms .chip{flex:none}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nums>div{padding:8px 10px;border:1px solid var(--ln);background:var(--pn2)}
.nums small{display:block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim2)}
.nums b{font:700 30px/1 'Teko',sans-serif;font-variant-numeric:tabular-nums}
.nums b.j{color:var(--j)}
.nums b.w{color:var(--ouro)}
.entro{grid-column:1/-1}
.entro .barra{position:relative;height:8px;background:#121c1a;margin:6px 0 4px}
.entro .barra i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(var(--j-rgb),.4),var(--j))}
.entro .leg{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.banco .pc{padding:6px 8px}
.banco .pc img{width:26px;height:26px}
.banco .pc .f{font-size:22px}

/* ======== AO VIVO ======== */
.viv{grid-template-columns:minmax(0,1fr) minmax(320px,400px);grid-template-rows:auto minmax(0,1fr)}
.placar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(12px,3vw,40px);padding:16px 22px}
.placar .t{display:flex;align-items:center;gap:12px;min-width:0}
.placar .t.d{flex-direction:row-reverse;text-align:right}
.placar .t b{display:block;font:700 clamp(28px,4.4vh,40px)/.9 'Teko',sans-serif;text-transform:uppercase;color:var(--c)}
.placar .t span{font-size:12.5px;color:var(--dim)}
.placar .esc3{display:flex;gap:4px}
.placar .esc3 img{width:30px;height:30px;object-fit:contain}
.placar .sc{text-align:center}
.placar .sc b{display:block;font:700 clamp(64px,10vh,96px)/.8 'Teko',sans-serif;letter-spacing:3px;font-variant-numeric:tabular-nums}
.placar .sc b i{font-style:normal;color:var(--dim2);margin:0 6px}
.placar .sc span{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:2px;color:var(--der)}
.placar .sc span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--der);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.mini{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px;min-height:0}
.pressao .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim2);margin-bottom:6px}
.pressao .br{display:flex;height:10px;gap:2px}
.pressao .br i{background:var(--j1)}.pressao .br i+i{background:var(--j2)}
.gramado{position:relative;height:120px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(90deg,#0b1a16,#08130f)}
.gramado::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)}
.gramado::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.1);border-radius:50%}
.gramado .gA,.gramado .gB{position:absolute;top:30%;bottom:30%;width:5%;border:1px solid rgba(255,255,255,.12)}
.gramado .gA{left:0;border-left:0}.gramado .gB{right:0;border-right:0}
.gramado .bola{position:absolute;left:68%;top:40%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;transition:left .6s,top .6s}
.gramado .ataq{position:absolute;left:50%;right:20%;top:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(var(--j1-rgb),.14))}
.stt{display:grid;grid-template-columns:1fr auto 1fr;gap:12px 14px;font-size:14px;align-content:start}
.stt .a{text-align:right;font:700 20px/1 'Teko',sans-serif}.stt .b{font:700 20px/1 'Teko',sans-serif}
.stt .k{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim2);align-self:center}
.ctrl{display:flex;gap:6px}
.ctrl .chip{flex:1}
.feed{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;background:var(--pn2);border-left:3px solid var(--c);animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}}
.ev .m{font:700 22px/1 'Teko',sans-serif;color:var(--dim)}
.ev small{display:block;font-size:12px;color:var(--dim)}
.ev.gol{background:linear-gradient(90deg,rgba(var(--c-rgb),.18),transparent);}
.ev.gol b.t{font:700 22px/1 'Teko',sans-serif;letter-spacing:1px;color:var(--c)}
.ev.verm{border-left-color:var(--der)}
.ev .cv{display:inline-block;width:10px;height:14px;background:var(--der);vertical-align:-2px;margin-right:6px}
.ev.neu{border-left-color:var(--ln2);grid-template-columns:1fr;text-align:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
/* B: feed em duas colunas como transmissão */
body.dirB .feed{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px 8px}
body.dirB .ev{grid-template-columns:1fr;border-left:0;border-top:2px solid var(--c);text-align:left}
body.dirB .ev.e{grid-column:1;text-align:right}
body.dirB .ev.d{grid-column:3}
body.dirB .ev .m{display:none}
body.dirB .mm{grid-column:2;text-align:center;font:700 20px/2 'Teko',sans-serif;color:var(--dim)}
body.dirB .ev.neu{grid-column:1/-1}

/* ======== INTERVALO ======== */
.itv{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.post .op button{align-items:center;text-align:center}
.post .op svg{width:44px;height:28px}
.subs{display:flex;flex-direction:column;gap:6px}
.troca{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;gap:6px}
.troca .seta{display:grid;place-items:center;color:var(--modo)}
.troca .pc.sai{border-color:rgba(255,90,106,.5)}
.troca .pc.ent{border-color:rgba(0,255,135,.5)}
.contador{display:flex;gap:6px}
.contador i{width:28px;height:8px;background:#1b2724}
.contador i.u{background:var(--j)}

/* ======== PÊNALTIS ======== */
.pen{grid-template-columns:minmax(0,1fr) 300px}
.golpen{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.trave{position:relative;width:min(100%,640px);aspect-ratio:3/1.15;border:6px solid #E9EEF0;border-bottom:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 16px),repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 16px)}
.zonas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.zonas button{border-right:1px dashed rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 26px/1 'Teko',sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.zonas button:last-child{border-right:0}
.zonas button:hover{background:rgba(var(--c-rgb),.08);color:var(--br)}
.zonas button[aria-pressed=true]{background:rgba(var(--c-rgb),.18);color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.zonas small{font:600 12px/1 'Rajdhani',sans-serif;letter-spacing:1px;color:var(--dim2);text-transform:none}
.marcapen{width:min(100%,640px);height:10px;border-top:2px solid rgba(255,255,255,.3)}
.duelo{display:flex;align-items:center;gap:18px}
.duelo .q{display:flex;align-items:center;gap:10px}
.duelo .q b{display:block;font:700 26px/1 'Teko',sans-serif;text-transform:uppercase}
.duelo .q span{font-size:12px;color:var(--dim)}
.duelo .q img{width:42px;height:42px;object-fit:contain}
.duelo .x{font:700 22px/1 'Teko',sans-serif;color:var(--dim2)}
.serie{display:flex;flex-direction:column;gap:10px}
.serie .ln{display:flex;align-items:center;gap:8px}
.serie .ln b{width:84px;font:700 20px/1 'Teko',sans-serif;text-transform:uppercase;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serie .ln i{width:20px;height:20px;border:1px solid var(--ln2);display:grid;place-items:center}
.serie .ln i.g{background:var(--c);border-color:var(--c)}
.serie .ln i.x{border-color:var(--der)}
.serie .ln i.x::after{content:"";width:12px;height:2px;background:var(--der);transform:rotate(45deg)}
.serie .ln i.p{border-style:dashed}
.etapas{display:flex;flex-direction:column;gap:8px}
.etapas div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--dim)}
.etapas div b{flex:none;width:24px;height:24px;display:grid;place-items:center;font:700 18px/1 'Teko',sans-serif;border:1px solid var(--ln2)}
.etapas div.on{color:var(--br)}.etapas div.on b{background:var(--c);color:#000;border-color:var(--c)}

/* ======== FIM ======== */
.fim{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.ban{grid-column:1/-1;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:18px 24px;
  background:linear-gradient(90deg,rgba(var(--j1-rgb),.22),rgba(0,0,0,.5) 55%)}
.ban .w small{display:block;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--j1)}
.ban .w b{display:block;font:700 clamp(46px,8vh,80px)/.82 'Teko',sans-serif;text-transform:uppercase;color:var(--j1);text-shadow:0 0 30px rgba(var(--j1-rgb),.4)}
.ban .w span{font-size:14px;color:var(--dim)}
.ban .sc{text-align:center}
.ban .sc b{display:block;font:700 clamp(60px,9vh,90px)/.8 'Teko',sans-serif;letter-spacing:3px}
.ban .sc span{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.ban .sr{justify-self:end;text-align:right}
.ban .sr small{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim2)}
.ban .sr b{font:700 36px/1 'Teko',sans-serif}
.ban .sr b .a{color:var(--j1)}.ban .sr b .b{color:var(--j2)}
.craque{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.craque .sel{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--ouro)}
.craque img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.craque b{font:700 38px/.9 'Teko',sans-serif;text-transform:uppercase}
.craque .nt{font:700 64px/1 'Teko',sans-serif;color:var(--ouro)}
.craque span{display:block;font-size:13px;color:var(--dim)}
.notas .pc{padding:5px 8px}
.notas .pc img{width:24px;height:24px}
.notas .nt{font:700 20px/1 'Teko',sans-serif;padding:3px 6px 1px;min-width:40px;text-align:center}
.nt.b{background:rgba(0,255,135,.14);color:var(--ok)}.nt.m{background:rgba(232,184,75,.14);color:var(--ouro)}.nt.r{background:rgba(255,90,106,.14);color:var(--der)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* ======== SALA ONLINE ======== */
.sala{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start}
.salaw{display:flex;flex-direction:column;gap:14px}
.cod{display:flex;gap:10px}
.cod span,.cod input{width:clamp(56px,7vw,84px);height:clamp(72px,10vh,104px);display:grid;place-items:center;text-align:center;border:1px solid var(--ln2);background:rgba(0,0,0,.35);
  font:700 clamp(48px,7vh,72px)/1 'Teko',sans-serif;color:var(--modo);text-transform:uppercase}
.cod span{border-color:rgba(77,163,255,.5);box-shadow:inset 0 0 24px rgba(77,163,255,.12)}
.cod input{color:var(--br)}
/* campo de codigo: 4 caracteres cabem na mesma largura de 4 caixas */
.cod.in input{width:min(100%,calc(4 * clamp(56px,7vw,84px) + 30px));letter-spacing:.34em;text-indent:.34em;padding:0 6px}
.cod.in input::placeholder{color:rgba(242,247,244,.25)}
@media (max-width:460px){.cod.in input{font-size:clamp(34px,11vw,52px);height:clamp(60px,14vw,86px)}}
.esp{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.esp i{width:10px;height:10px;border-radius:50%;background:var(--modo);animation:pisca 1s infinite}
.jog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jog div{padding:10px 12px;border:1px solid var(--ln);border-top:3px solid var(--c)}
.jog b{display:block;font:700 24px/1 'Teko',sans-serif;text-transform:uppercase;color:var(--c)}
.jog span{font-size:12px;color:var(--dim2)}
.jog .vaz{border-style:dashed;border-top-style:solid;opacity:.6}
.tirar{margin-left:auto;height:28px;padding:0 10px;border:1px solid var(--ln2);font:600 16px/1 'Teko',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.tirar:hover{border-color:var(--der);color:var(--der)}
.esc3 .lg{width:40px;height:40px;object-fit:cover;border-radius:10px;border:1px solid var(--ln2)}
.vg.entrou .cam::after{content:"";position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:var(--ok);transform:rotate(45deg);box-shadow:0 0 8px var(--ok)}
.pc.saiu{opacity:.45}.pc.saiu .mk{color:var(--der)}
.itv2 .lado{grid-template-rows:auto auto minmax(0,1fr) auto}
.post .op button{padding:8px 10px}.post .op svg{width:36px;height:22px}

/* ======== responsivo: celular ======== */
@media (max-width:860px){
  :root{--cut:12px}
  .hdA{grid-template-columns:1fr auto 1fr;padding:10px 14px 8px}
  .pl b{font-size:22px}.pl small{display:none}.vs .x{font-size:26px}.vs small{font-size:9px;letter-spacing:2px}
  .hdB{padding:10px 14px 8px}.hdB .marca span,.hdB .fase{display:none}.bug .t{font-size:18px;padding:0 10px}.bug .m{min-width:70px}
  .corpo{gap:10px}
  .lob{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .heroimg{min-height:0;padding:14px}.heroimg h1{font-size:42px}.heroimg .eyb{font-size:11px}
  .riv{padding:8px 10px}.riv .p{font-size:28px}.riv .rod{display:none}
  .cfg{gap:10px}.cfg .acl{position:sticky;bottom:-16px;margin:0 -16px -16px;padding:10px 16px 16px;background:linear-gradient(180deg,rgba(9,16,15,0),#09100f 30%)}
  .lob{grid-template-rows:auto minmax(0,1fr)}.heroimg h1{font-size:38px}
  .drf{grid-template-columns:1fr 1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .drf .picks{gap:4px}.drf .picks .tot{display:none}.slotc{height:40px}.slotc img{width:26px;height:26px}.slotc b{font-size:16px}.slotc span{display:none}
  .drf .clubes-w{grid-column:1/-1}
  .clubes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .clube img{width:40px;height:40px}.clube b{font-size:16px}
  .rb{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rev{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .carta{height:100%}.carta img{width:48px;height:48px}.carta .f{font-size:30px}
  .esc{grid-template-columns:1fr;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
  .lado{gap:8px}.lado .cta{height:44px;font-size:21px}
  .nums b{font-size:24px}.entro .leg span{display:none}
  .cta{padding:0 18px;font-size:21px}
  .viv{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .placar{padding:10px 12px}.placar .esc3,.placar .t span{display:none}
  .mini{grid-template-rows:auto auto}.mini .wgram,.mini .stt{display:none}
  .itv{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .pen{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.pen .etapas{display:none}
  .zonas button{font-size:18px}.zonas small{display:none}
  .sala{grid-template-columns:1fr}.cod span,.cod input{width:60px;height:72px;font-size:48px}
  .post .op span{display:none}
  .fim{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr)}
  .ban{grid-template-columns:1fr auto;padding:12px 14px}.ban .sr{display:none}
  .craque{grid-column:1/-1;flex-direction:row;padding:10px}.craque img{width:52px;height:52px}.craque b{font-size:26px}.craque .nt{font-size:40px!important}.craque>div:not(.acoes) span,.craque .sel{display:none}
  .grade{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== J × J 2.0: extras do jogo (o resto veio do teste aprovado) ===== */
body{margin:0}
.modo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mcard{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:clamp(18px,3vw,34px)!important;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}
.mcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.85)}
.mcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,9,8,.05) 25%,rgba(4,9,8,.8) 65%,#040908)}
.mcard.on{background:radial-gradient(700px 420px at 70% 20%,rgba(77,163,255,.22),transparent 60%),repeating-linear-gradient(90deg,rgba(77,163,255,.05) 0 2px,transparent 2px 60px),var(--pn)}
.mcard:hover,.mcard:focus-visible{transform:translateY(-3px);border-color:var(--modo)}
.mcard .tag{align-self:flex-start;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:4px 10px;color:#03101f;background:var(--modo);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.mcard b{font:700 clamp(46px,8vh,84px)/.85 'Teko',sans-serif;text-transform:uppercase}
.mcard span:not(.tag){font-size:16px;color:var(--dim);max-width:44ch}
.mcard i{font:700 24px/1 'Teko',sans-serif;font-style:normal;letter-spacing:1.5px;text-transform:uppercase;color:var(--modo);display:flex;align-items:center;gap:8px}
.rodape{flex:none;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 16px clamp(10px,2vh,18px)}
.erro{padding:10px 12px;border:1px solid rgba(255,90,106,.5);background:rgba(255,90,106,.1);color:#ffb3bb;font-size:14px}
.liga select{margin-left:auto;max-width:44%;height:36px;background:#0b1316;color:var(--br);border:1px solid var(--ln2);font:600 14px 'Rajdhani',sans-serif;padding:0 8px}
.liga select:disabled{opacity:.6}
button:disabled{cursor:not-allowed}
.cta:disabled{opacity:.4;box-shadow:none}
.op button:disabled,.chip:disabled{opacity:.75}
.clube:disabled:not(.tom){opacity:.85}
.ordem .o.agora.q0{background:var(--j1);color:var(--on1);border-color:var(--j1);box-shadow:0 0 14px rgba(var(--j1-rgb),.5)}
.ordem .o.agora.q1{background:var(--j2);color:var(--on2);border-color:var(--j2);box-shadow:0 0 14px rgba(var(--j2-rgb),.5)}
.picks .sec{height:36px;font-size:17px}
.slotc>div{min-width:0;flex:1}.slotc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev.um{grid-template-columns:minmax(0,560px);justify-content:center}
.vg{cursor:grab;touch-action:none;user-select:none}
.vg.expulso{opacity:.35}.vg.expulso .nm{text-decoration:line-through}
.vg.alvo .cam{outline:2px solid var(--modo);outline-offset:4px}
.pc{cursor:pointer;touch-action:manipulation}
.fant{position:fixed;z-index:99;transform:translate(-50%,-50%);pointer-events:none;background:var(--modo);color:#03101f;font:700 18px/1 'Teko',sans-serif;letter-spacing:1px;padding:6px 10px;box-shadow:0 6px 18px #000b}
.pnult{font:700 22px/1 'Teko',sans-serif;letter-spacing:1px;text-transform:uppercase;padding:6px 12px}
.pnult.ok{color:var(--ok)}.pnult.no{color:var(--der)}
.zonas button:disabled{cursor:default}
.segura{cursor:pointer;touch-action:none}
.segura i{width:0;transition:none}
.esc .lado,.itv2 .lado{display:flex;flex-direction:column;gap:10px;min-height:0}
.esc .lado .banco{flex:1 1 auto;min-height:0}
.esc .lado>*{flex:none}
.esc .lado>.banco{flex:1 1 auto}
@media (max-width:860px){
  .modo{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .mcard b{font-size:40px}.mcard span:not(.tag){font-size:14px}
  .liga select{max-width:50%}
  .placar{gap:8px}.placar .t,.placar .t>div{min-width:0}
  .placar .t b{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .placar .sc b{font-size:52px;white-space:nowrap}
  .ban .w b{font-size:38px}.ban .sc b{font-size:46px;white-space:nowrap}
  .craque{flex-wrap:wrap;justify-content:center}.craque .acoes{flex-wrap:wrap;justify-content:center}
  .craque .cta{height:42px;font-size:19px;padding:0 14px}
}

/* ======== escalação: o elenco precisa aparecer (antes o banco ficava com 2-3 linhas) ======== */
/* PC: o painel lateral rola inteiro e o banco tem altura mínima garantida */
.esc .lado{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
.esc .lado>.banco{min-height:clamp(240px,42vh,560px)}
.esc .lado>.cta{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 18px rgba(0,0,0,.55)}
.esc .nums>div{padding:6px 10px}.esc .nums b{font-size:26px}
@media (max-height:820px) and (min-width:861px){
  .esc .post .op span,.esc .entro .leg{display:none}
  .esc .post .op button{padding:6px 10px}
  .esc .lado{gap:8px}
}
/* celular e tela estreita: a página rola; campo em proporção fixa, elenco inteiro embaixo */
@media (max-width:860px){
  .corpo.esc{display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;gap:10px}
  .corpo.esc>.campo{flex:none;height:min(58vh,118vw);min-height:300px}
  .esc .lado{overflow:visible;flex:none}
  .esc .lado>.banco{flex:none;min-height:0;max-height:none;overflow:visible}
  .esc .lado>.cta{position:sticky;bottom:0}
  .esc .post .op button{padding:6px 8px}
}

const cobradorDe = (k) => { const P = S.pen; const ids = P.ordem[k]; const id = ids[P.g[k].length % ids.length]; return S.j[k].elenco.find((p) => p.id === id) || S.j[k].xi.find((p) => p && p.id === id); };
/* Pênalti no escuro (regra nova, inventada): mesmo lado do pulo = 30% de gol (meio contra meio 15%);

function cobranca(cz, gz) {

function notasDoTime(k) {

const CHAVE_RIVAL = 'promessa-jxj-rival-v1';

  const g = S.jogo; if (!g) return;
  const feitos = (() => { try { return JSON.parse(sessionStorage.getItem('promessa-jxj-rival-feitos') || '[]'); } catch (e) { return []; } })();

  try {
    const todos = lerRival(); const k = chaveDupla();

    r.jogos++;

function campinho(j, k, modo) {

  return `<div class="campo" id="campo"><span class="ar t"></span><span class="ar b"></span>
    ${linhas.map((l) => `<div class="lin">${l.map((i) => {
      const p = j.xi[i]; const pen = p ? penalidade(p.pos, vg[i], p.posAlt) : 0;
      if (!p) return `<div class="vg vazia" data-vaga="${i}"><div class="cam">+</div><span class="ps">${vg[i]}</span></div>`;
      const cls = [modo === 'intervalo' && j.entrou.includes(p.id) ? 'entrou' : '', exp.includes(p.id) ? 'expulso' : '', UI.sel && UI.sel.vaga === i ? 'alvo' : ''].join(' ');

    }).join('')}</div>`).join('')}</div>`;
}

/* Arrastar com pointer events (serve para dedo e mouse). Clique sem arrasto cai no clique normal. */
function ligaArrastar(modo) {
  const campo = $('#campo'), banco = $('#banco'); if (!campo || !banco) return;
  const j = S.j[UI.seat];
  let fant = null, id = null, de = null, mov = false, x0 = 0, y0 = 0;
  const pega = (e) => {
    const b = e.target.closest('#banco .pc'), v = e.target.closest('#campo .vg:not(.vazia)');
    if (!b && !v) return;
    id = b ? b.dataset.id : (j.xi[+v.dataset.vaga] || {}).id; de = b ? 'banco' : +v.dataset.vaga;
    if (!id) return;
    mov = false; x0 = e.clientX; y0 = e.clientY;
    if (b && e.pointerType !== 'mouse') {
      // celular: na lista o dedo rola a tela; arrastar só dentro da prancheta
      const fim = (ev) => {
        document.removeEventListener('pointerup', fim); document.removeEventListener('pointercancel', fim);
        if (ev.type === 'pointerup' && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 10) clique(ev);
      };
      document.addEventListener('pointerup', fim); document.addEventListener('pointercancel', fim);
      return;
    }
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', solta, { once: true });
    document.addEventListener('pointercancel', cancela, { once: true });
  };
  const cancela = () => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', solta);
    if (fant) { fant.remove(); fant = null; }
    mov = false;
  };
  const move = (e) => {
    if (!mov) { if (Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) < 8) return; mov = true; fant = document.createElement('div'); fant.className = 'fant'; fant.textContent = sobre((j.elenco.find((p) => p.id === id) || {}).nome); document.body.appendChild(fant); }
    fant.style.left = e.clientX + 'px'; fant.style.top = e.clientY + 'px';
  };
  const solta = (e) => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointercancel', cancela);
    if (fant) { fant.remove(); fant = null; }
    const eraArrasto = mov; mov = false;
    if (!eraArrasto) return clique(e);
    const sob = document.elementFromPoint(e.clientX, e.clientY);
    const v = sob && sob.closest && sob.closest('#campo .vg');
    if (v) return faz('por', { idx: +v.dataset.vaga, id });
    if (de !== 'banco' && modo === 'escalar') faz('tirarVaga', { idx: de });
  };
  const clique = (e) => {
    const b = e.target.closest('#banco .pc'), v = e.target.closest('#campo .vg');
    if (modo === 'escalar') {
      if (b) return faz('auto', { id: b.dataset.id });
      if (v && j.xi[+v.dataset.vaga]) return faz('tirarVaga', { idx: +v.dataset.vaga });
      return;
    }
    /* intervalo: escolhe no banco, depois toca na vaga */
    if (b) { if (j.xi.some((p) => p && p.id === b.dataset.id) || j.saiu.includes(b.dataset.id)) return; UI.sel = { id: b.dataset.id }; return render(); }
    if (v && UI.sel) { const sid = UI.sel.id; UI.sel = null; return faz('por', { idx: +v.dataset.vaga, id: sid }); }
  };
  campo.addEventListener('pointerdown', pega); banco.addEventListener('pointerdown', pega);
}

function pintaVivo() {
  const g = S.jogo; if (!g || S.fase !== 'vivo') return;

    const cel = `<div class="ev ${e.t} ${e.k ? 'd' : 'e'}" style="${corJ(e.k)}">${corpo(e)}</div>`;

  }).join('') || '<div class="ev neu">Bola rolando</div>';

  el('vSt').innerHTML = `<span class="a num">${fin[0]}</span><span class="k">Finalizações</span><span class="b num">${fin[1]}</span>
    <span class="a num">${g.st.posse}%</span><span class="k">Posse</span><span class="b num">${100 - g.st.posse}%</span>
    <span class="a num">${ama[0]}</span><span class="k">Amarelos</span><span class="b num">${ama[1]}</span>
    <span class="a num">${ver[0]}</span><span class="k">Vermelhos</span><span class="b num">${ver[1]}</span>`;

  const esperando = S.modo === 'online' && S.j[UI.seat].apito;
  el('vCtrl').innerHTML = acabou
    ? (esperando ? `<span class="dica" style="align-self:center">Esperando ${esc(S.j[1 - UI.seat].nome)} terminar de assistir…</span>` : `<button type="button" class="cta" id="btApito" style="flex:1">${g.tempo === 1 ? 'Ir para o intervalo' : (g.ga === g.gb ? 'Ir para os pênaltis' : 'Ver o resultado')} ${ICO.seta}</button>`)
    : `<button type="button" class="chip" data-vel="1" aria-pressed="${UI.vel === 1}">1×</button><button type="button" class="chip" data-vel="3" aria-pressed="${UI.vel === 3}">3×</button><button type="button" class="chip" id="btPular">Pular</button>`;

/* =====================================================================
   ONLINE — sala por código no Supabase Realtime (canal de broadcast, sem
   banco). Quem cria a sala é o anfitrião: roda todas as regras e manda o
   estado; o convidado só manda ações. O estado que vai para o convidado
   esconde o que é segredo do anfitrião (trancado, descartável, escalação
   antes do apito, canto do pênalti). O anfitrião, tecnicamente, tem tudo
   no aparelho dele: é o preço de não ter servidor próprio.
   ===================================================================== */
const SALA = { url: 'https://qtdycffnwqblysfgvmck.supabase.co', chave: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0ZHljZmZud3FibHlzZmd2bWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjM3MzIsImV4cCI6MjEwNzM5OTczMn0.BkAcm3zYNVoHV1xWDeKvMrLaZrC9Sobyrm5L5bf_Zq4' };
const ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET = {
  papel: null, codigo: null, canal: null, cli: null, sid: Math.random().toString(36).slice(2, 10), rival: null, aviso: null,
  async lib() {
    if (window.supabase && window.supabase.createClient) return;
    await new Promise((ok, falha) => { const s = document.createElement('script'); s.src = 'vendor/supabase-2.45.4.js'; s.onload = ok; s.onerror = () => falha(new Error('biblioteca da sala não carregou')); document.head.appendChild(s); });
  },
  async abre(codigo, papel) {
    await this.lib();
    this.cli = this.cli || window.supabase.createClient(SALA.url, SALA.chave, { auth: { persistSession: false } });
    this.codigo = codigo; this.papel = papel;
    const ch = this.cli.channel('jxj:' + codigo, { config: { broadcast: { self: false, ack: false }, presence: { key: papel + ':' + this.sid } } });
    this.canal = ch;
    ch.on('broadcast', { event: 'estado' }, ({ payload }) => this.recebeEstado(payload));
    ch.on('broadcast', { event: 'acao' }, ({ payload }) => this.recebeAcao(payload));
    ch.on('broadcast', { event: 'oi' }, ({ payload }) => this.recebeOi(payload));
    ch.on('broadcast', { event: 'cheia' }, ({ payload }) => { if (payload && payload.sid === this.sid) { this.aviso = 'Essa sala já tem dois jogadores.'; this.sair(); S.fase = 'sala'; render(); } });
    ch.on('presence', { event: 'leave' }, ({ key }) => {
      if (this.papel === 'guest' && String(key).startsWith('host:')) { this.aviso = 'O anfitrião saiu da sala.'; render(); }
      if (this.papel === 'host' && this.rival && key === 'guest:' + this.rival) { this.aviso = S.j[1].nome + ' saiu da sala. Se voltar com o mesmo código, o jogo continua.'; render(); }
    });
    ch.on('presence', { event: 'join' }, ({ key }) => { if (this.papel === 'host' && this.rival && key === 'guest:' + this.rival) { this.aviso = null; this.publica(); render(); } });
    await new Promise((ok, falha) => {
      const t = setTimeout(() => falha(new Error('sem resposta do servidor da sala')), 10000);
      ch.subscribe((st) => { if (st === 'SUBSCRIBED') { clearTimeout(t); ok(); } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { clearTimeout(t); falha(new Error('conexão da sala: ' + st)); } });
    });

  },
  manda(evento, payload) {
    if (!this.canal) return;
    this.canal.send({ type: 'broadcast', event: evento, payload: Object.assign({ sid: this.sid }, payload) })
      .then((r) => { if (r !== 'ok') console.warn('[jxj sala] envio ' + evento + ':', r); })
      .catch((e) => console.error('[jxj sala] envio ' + evento + ':', e));
  },

  },
  recebeOi(p) {
    if (this.papel !== 'host' || !p || !p.sid) return;
    if (ULT.on) return ULT.hostRecebeOi(p);
    if (this.rival && this.rival !== p.sid) return this.manda('cheia', { sid: p.sid });
    this.rival = p.sid;
    act(1, 'nome', { nome: p.nome });
    if (S.fase === 'sala') { S.fase = 'cfg'; }
    this.aviso = null;

  },
  async sair() { try { if (this.canal) await this.canal.unsubscribe(); } catch (e) { console.warn('[jxj sala] sair:', e); } this.canal = null; },

/** O que o convidado (assento k) pode ver: segredos do outro escondidos. */
function vista(k) {
  const V = JSON.parse(JSON.stringify(S));
  const o = V.j[1 - k];
  if (V.fase === 'roubo') { o.lock = o.desc = o.alvo = null; }
  if ((V.fase === 'escalar' || V.fase === 'intervalo') && !(S.j[0].pronto && S.j[1].pronto)) { o.xi = o.xi.map(() => null); o.postura = 'eq'; o.entrou = []; o.saiu = []; }
  if (V.fase === 'penaltis' && V.pen && V.pen.etapa === 'pulo' && V.pen.vez === 1 - k) V.pen.cz = null;
  return V;
}

    cria.disabled = true; NET.aviso = null;
    const codigo = Array.from({ length: 4 }, () => ALFA[Math.floor(Math.random() * ALFA.length)]).join('');
    try { S.j[0].nome = nome; S.j[1].nome = 'Rival'; await NET.abre(codigo, 'host'); render(); } catch (e) { falhou(e); }
  };
  const cp = $('#btCopia'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(NET.codigo); cp.textContent = 'Copiado'; } catch (e) { console.warn('[jxj] copiar:', e); cp.textContent = NET.codigo; } };
  const cc = $('#btCanc'); if (cc) cc.onclick = async () => { await NET.sair(); NET.papel = NET.codigo = null; render(); };
  const ent = $('#btEntra');
  if (ent) ent.onclick = async () => {
    const codigo = String($('#cod').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (codigo.length !== 4) { NET.aviso = 'O código tem 4 letras ou números.'; return render(); }
    const nome = limpaNome($('#nmG').value, 'Jogador 2'); guardaNome(nome);
    ent.disabled = true; NET.aviso = null;
    try {
      await NET.abre(codigo, 'guest');
      NET.manda('oi', { nome });
      NET.espera = setTimeout(() => { if (S.fase === 'sala') { NET.aviso = 'Sala ' + codigo + ' não encontrada. Confira o código com quem criou.'; NET.sair(); NET.papel = NET.codigo = null; render(); } }, 7000);
    } catch (e) { falhou(e); }
  };
  $('#btVolta').onclick = async () => { await NET.sair(); NET.papel = NET.codigo = null; S.modo = null; S.fase = 'modo'; render(); };
}

/* =====================================================================
   ULTIMATE ONLINE (jxj.html?ult=1) — mesmo motor e sala do JxJ online, mas:
   - só online, com conta; elenco = cartas do jogador (servidor valida posse em meu_ult_*);
   - sem draft nem roubo: vai direto para a escalação, jogo único;
   - o placar é informado pelos dois lados (meu_ult_resultado) e só conta no ranking se bater.
   O anfitrião ainda roda o motor (como no JxJ); a revalidação pelo convidado fica para a fase 2.
   ===================================================================== */
const ULT = {
  on: new URLSearchParams(location.search).has('ult'),
  sb: null, J: null, rev: {}, elenco: [], ids: [], partida: null, codigo: null, aviso: null, ocupado: false,
  fila: null, oiTimer: null, reportado: false, res: null, saindo: false,
  pausa: (ms) => new Promise((ok) => setTimeout(ok, ms)),
  async inicia() {
    try {
      const P = window.Promessa;
      if (!P || !P.sb) throw new Error('sessão do PROMESSA não carregou');
      const u = await P.usuario();
      if (!u) { location.replace('conta/login.html?next=' + encodeURIComponent('jxj.html?ult=1')); return; }
      this.sb = P.sb; NET.cli = P.sb;
      for (const t in (D.SLUGS || {})) this.rev[D.SLUGS[t]] = t;
      const [r, J] = await Promise.all([
        this.sb.from('cards').select('id,jogador_id,ovr_snapshot,em_venda,destruida_em').eq('dono_id', u.id).limit(5000),
        fetch('dados/ult_jogadores.json').then((x) => { if (!x.ok) throw new Error('ult_jogadores ' + x.status); return x.json(); }),
      ]);
      if (r.error) throw r.error;
      this.J = J;
      // melhor versão de cada jogador; 2 goleiros garantidos; até 23 cartas
      const melhor = {};
      for (const c of r.data || []) {
        if (c.em_venda || c.destruida_em || !J[c.jogador_id]) continue;
        if (!melhor[c.jogador_id] || melhor[c.jogador_id].ovr_snapshot < c.ovr_snapshot) melhor[c.jogador_id] = c;
      }
      this.uid = u.id;
      this.todas = Object.values(melhor).map((c) => this.jogador({ card: c.id, jogador: c.jogador_id, ovr: c.ovr_snapshot })).filter(Boolean).sort((a, b) => b.forca - a.forca);
      let salvo = [];
      try { salvo = JSON.parse(localStorage.getItem('promessa-ult-elenco-' + u.id) || '[]'); } catch (e) { console.warn('[ult] elenco salvo:', e); }
      const valido = salvo.filter((id) => this.todas.some((p) => p.card === id));
      this.aplica(valido.length >= 11 ? valido : this.automatico());
      const apelido = (P.obterApelido ? P.obterApelido(u, null) : null) || (u.user_metadata && (u.user_metadata.nick || u.user_metadata.apelido)) || 'Você';
      S.modo = 'online'; S.fase = 'ultsala';
      S.cfg = { formato: 'unico', liga: '', montagem: 'ult', roubos: 0, pen: 'auto' };
      S.j[0].nome = limpaNome(apelido, 'Você'); S.j[1].nome = 'Rival';
    } catch (e) {
      console.error('[ult] inicio:', e);
      this.aviso = 'Não deu para carregar suas cartas. Tente de novo em instantes.';
      S.modo = 'online'; S.fase = 'ultsala';
    }
    render();
  },
  jogador(x) {
    const j = this.J && this.J[x.jogador];
    if (!j) return null;
    const slug = String(x.jogador).split('|')[0];
    return { id: String(x.jogador), nome: j[0], pos: j[1], idade: j[2], nac: j[3], posAlt: [], forca: Number(x.ovr) || 50, cl: this.rev[slug] || j[4] || '', card: x.card };
  },
  // melhor time automático: 2 goleiros + os de maior força, até 23
  automatico() {
    const gols = this.todas.filter((p) => p.pos === 'GOL').slice(0, 2);
    return gols.concat(this.todas.filter((p) => !gols.includes(p)).slice(0, 23 - gols.length)).map((p) => p.card);
  },
  aplica(ids) {
    const set = new Set(ids);
    this.elenco = this.todas.filter((p) => set.has(p.card));
    this.ids = this.elenco.map((p) => p.card);
  },
  guarda() { try { localStorage.setItem('promessa-ult-elenco-' + this.uid, JSON.stringify(this.ids)); } catch (e) { console.warn('[ult] guardar elenco:', e); } },
  telaElenco() {
    const sel = this.rascunho, q = (this.busca || '').toLowerCase().trim();
    const lista = this.todas.filter((p) => !q || p.nome.toLowerCase().includes(q) || p.pos.toLowerCase() === q || String(p.cl).toLowerCase().includes(q));
    const n = sel.size, ok = n >= 11 && n <= 23;
    const gol = this.todas.filter((p) => sel.has(p.card) && p.pos === 'GOL').length;
    pinta(`${cab('Seu elenco')}
    <section class="corpo" style="grid-template-rows:auto minmax(0,1fr) auto">
      <div class="pn salaw"><p class="dica">Escolha de 11 a 23 cartas para levar à partida. Você tem ${this.todas.length} jogadores diferentes (a melhor carta de cada um).</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="uBusca" class="inp" value="${esc(this.busca || '')}" placeholder="Buscar nome, clube ou posição (ex.: ZAG)" style="flex:1;min-width:180px;padding:10px;background:var(--pn2);border:1px solid var(--ln2);color:var(--br)">
          <b class="num" style="font-size:26px;color:${ok ? 'var(--ok)' : 'var(--der)'}">${n}/23</b>
        </div>
        ${gol === 0 ? '<p class="dica" style="color:var(--ouro)">Sem goleiro: quem for para o gol joga fora de posição.</p>' : ''}
      </div>
      <div class="pn rola" style="padding:8px">${lista.length ? lista.map((p) => `<button type="button" data-uel="${esc(p.card)}" aria-pressed="${sel.has(p.card)}" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid ${sel.has(p.card) ? 'var(--j1)' : 'var(--ln)'};background:${sel.has(p.card) ? 'rgba(var(--j1-rgb),.12)' : 'transparent'};color:var(--br);text-align:left">
          <span style="width:22px;font-weight:800;color:var(--j1)">${sel.has(p.card) ? '<i style="display:inline-block;width:12px;height:12px;background:var(--j1)"></i>' : ''}</span><span style="width:42px;font-weight:700">${esc(p.pos)}</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome)}<small style="color:var(--dim)"> · ${esc(p.cl || '')}</small></span><b class="num" style="font-size:22px">${p.forca}</b></button>`).join('') : '<p class="dica">Nenhum jogador com esse filtro.</p>'}</div>
      <div class="acoes" style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="cta" id="uElSalva" ${ok ? '' : 'disabled'}>Usar este elenco ${ICO.seta}</button>
        <button type="button" class="sec" id="uElAuto">Melhor automático</button><button type="button" class="sec" id="uElLimpa">Limpar</button><button type="button" class="sec" id="uElCanc">Cancelar</button>
      </div>
    </section>`);
    const b = $('#uBusca'); b.oninput = () => { this.busca = b.value; const pos = b.selectionStart; this.telaElenco(); const nb = $('#uBusca'); nb.focus(); nb.setSelectionRange(pos, pos); };
    st().querySelectorAll('[data-uel]').forEach((x) => x.onclick = () => {
      const id = x.dataset.uel;
      if (sel.has(id)) sel.delete(id); else if (sel.size < 23) sel.add(id); else return;
      const y = st().querySelector('.rola').scrollTop; this.telaElenco(); st().querySelector('.rola').scrollTop = y;
    });
    $('#uElSalva').onclick = () => { this.aplica([...sel]); this.guarda(); this.editando = false; render(); };
    $('#uElAuto').onclick = () => { this.rascunho = new Set(this.automatico()); this.telaElenco(); };
    $('#uElLimpa').onclick = () => { this.rascunho = new Set(); this.telaElenco(); };
    $('#uElCanc').onclick = () => { this.editando = false; render(); };
  },
  forca() { return this.elenco.length ? Math.round(this.elenco.slice(0, 11).reduce((a, p) => a + p.forca, 0) / Math.min(11, this.elenco.length)) : 0; },
  erro(e, padrao) { const m = String((e && e.message) || ''); return /[a-zà-ú]{4}/i.test(m) && !/fetch|network|jwt/i.test(m) ? m : padrao; },
  tela() {
    if (this.editando) return this.telaElenco();
    const pode = this.elenco.length >= 11 && !this.ocupado;
    const esperandoSala = NET.papel === 'host' && this.codigo && !NET.rival;
    const naFila = !!this.fila;
    const top = this.elenco.slice(0, 11).map((p) => `<span class="dica">${esc(p.pos)} ${esc(sobre(p.nome))} <b class="num">${p.forca}</b></span>`).join(' · ');
    pinta(`${cab('Ultimate online')}
    <section class="corpo sala">
      <div class="pn salaw" style="grid-column:1/-1"><h3 class="h3">Seu time</h3>
        ${this.elenco.length >= 11
          ? `<p class="dica">${this.elenco.length} cartas · força média dos 11 melhores <b class="num">${this.forca()}</b>. A escalação você monta na próxima tela.</p><p>${top}</p>`
          : (this.todas || []).length >= 11 ? `<p class="dica">Escolha pelo menos 11 cartas para jogar.</p>`
          : `<p class="dica">Para jogar online você precisa de pelo menos 11 jogadores diferentes na coleção (sem anúncio no mercado). Você tem ${(this.todas || []).length}. Abra pacotes para completar o time.</p>`}
        ${(this.todas || []).length >= 11 && !this.partida && !this.fila ? `<button type="button" class="sec" id="uElenco" style="align-self:flex-start">Escolher elenco</button>` : ''}
      </div>
      <div class="pn salaw"><h3 class="h3">Desafiar um amigo</h3>
        ${esperandoSala ? `<div class="cod" aria-label="Código da sala">${this.codigo.split('').map((c) => `<span>${c}</span>`).join('')}</div>
          <p class="dica">Mande o código. A sala expira em 30 minutos.</p><div class="esp"><i></i><span>Esperando o rival…</span></div>
          <div class="acoes"><button type="button" class="sec" id="uCopia">Copiar código</button><button type="button" class="sec" id="uCanc">Cancelar</button></div>`
        : `<button type="button" class="cta" id="uCria" ${pode && !naFila ? '' : 'disabled'} style="align-self:flex-start">Criar sala ${ICO.seta}</button>
          <div class="cod in"><input id="uCod" maxlength="4" autocomplete="off" spellcheck="false" aria-label="Código da sala" placeholder="K7Q4" ${pode && !naFila ? '' : 'disabled'}></div>
          <button type="button" class="sec" id="uEntra" ${pode && !naFila ? '' : 'disabled'} style="align-self:flex-start">Entrar com código</button>`}
      </div>
      <div class="pn salaw"><h3 class="h3">Partida rápida</h3>
        ${naFila ? `<div class="esp"><i></i><span>Procurando rival com força parecida…</span></div><button type="button" class="sec" id="uSaiFila">Sair da fila</button>`
          : `<p class="dica">Pareia você com alguém de força parecida. Vitórias contam no ranking do mês.</p>
             <button type="button" class="cta" id="uFila" ${pode && !esperandoSala ? '' : 'disabled'} style="align-self:flex-start">Entrar na fila ${ICO.seta}</button>`}
      </div>
      ${this.aviso || NET.aviso ? `<div class="erro" style="grid-column:1/-1">${esc(this.aviso || NET.aviso)}</div>` : ''}
    </section>
    <div class="rodape"><button type="button" class="sec" id="uVolta">Voltar ao Ultimate</button></div>`);
    const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
    on('uElenco', () => { this.rascunho = new Set(this.ids); this.busca = ''; this.editando = true; render(); });
    on('uCria', () => this.criaSala());
    on('uEntra', () => this.entraSala());
    on('uFila', () => this.entraFila());
    on('uSaiFila', () => this.saiFila());
    on('uCanc', async () => { await this.abandona(); await NET.sair(); NET.papel = null; this.codigo = this.partida = null; render(); });
    on('uCopia', async (ev) => { try { await navigator.clipboard.writeText(this.codigo); ev.target.textContent = 'Copiado'; } catch (e) { console.warn('[ult] copiar:', e); ev.target.textContent = this.codigo; } });
    on('uVolta', async () => { await this.saiFila(); await this.abandona(); await NET.sair(); location.href = 'cartas/index.html#online'; });
  },
  async criaSala() {
    this.ocupado = true; this.aviso = NET.aviso = null; render();
    try {
      const r = await this.sb.rpc('meu_ult_cria_sala', { p_cards: this.ids });
      if (r.error) throw r.error;
      this.partida = r.data.partida; this.codigo = r.data.codigo;
      await NET.abre('ult-' + this.partida, 'host');
    } catch (e) { console.error('[ult] cria sala:', e); this.aviso = this.erro(e, 'Não deu para criar a sala. Tente de novo.'); NET.papel = null; this.codigo = this.partida = null; }
    this.ocupado = false; render();
  },
  async entraSala() {
    const cod = String(($('#uCod') || {}).value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (cod.length !== 4) { this.aviso = 'O código tem 4 letras ou números.'; return render(); }
    this.ocupado = true; this.aviso = NET.aviso = null; render();
    try {
      const r = await this.sb.rpc('meu_ult_entra_sala', { p_codigo: cod, p_cards: this.ids });
      if (r.error) throw r.error;
      this.partida = r.data.partida;
      await this.conectaConvidado();
    } catch (e) { console.error('[ult] entra sala:', e); this.aviso = this.erro(e, 'Não deu para entrar na sala.'); this.ocupado = false; render(); }
  },
  async conectaConvidado() {
    await NET.abre('ult-' + this.partida, 'guest');
    // o anfitrião pode ainda estar entrando no canal: repete o "oi" até o estado chegar
    let n = 0;
    const oi = () => { if (S.fase !== 'ultsala' || n++ > 15) { clearInterval(this.oiTimer); if (S.fase === 'ultsala') { this.aviso = 'O rival não respondeu. Tente de novo.'; this.ocupado = false; render(); } return; } NET.manda('oi', { nome: S.j[0].nome }); };
    oi(); this.oiTimer = setInterval(oi, 2000);
  },
  async entraFila() {
    this.aviso = null; this.fila = true; render();
    const tenta = async () => {
      if (!this.fila) return;
      try {
        const r = await this.sb.rpc('meu_ult_fila', { p_cards: this.ids });
        if (r.error) throw r.error;
        const d = r.data || {};
        if (d.partida) {
          clearInterval(this.fila); this.fila = null; this.partida = d.partida;
          if (d.papel === 'host') { await NET.abre('ult-' + this.partida, 'host'); render(); }
          else {
            const e = await this.sb.rpc('meu_ult_elenco_partida', { p_partida: this.partida, p_cards: this.ids });
            if (e.error) throw e.error;
            this.ocupado = true; render(); await this.conectaConvidado();
          }
        }
      } catch (e) { console.error('[ult] fila:', e); clearInterval(this.fila); this.fila = null; this.aviso = this.erro(e, 'A fila caiu. Tente de novo.'); render(); }
    };
    await tenta(); if (this.fila) this.fila = setInterval(tenta, 3000);
  },
  async saiFila() {
    if (!this.fila) return;
    clearInterval(this.fila); this.fila = null;
    try { const r = await this.sb.rpc('meu_ult_sai_fila'); if (r.error) throw r.error; } catch (e) { console.warn('[ult] sair da fila:', e); }
    render();
  },
  async hostRecebeOi(p) {
    if (NET.rival && NET.rival !== p.sid) return NET.manda('cheia', { sid: p.sid });
    if (NET.rival === p.sid && S.fase !== 'ultsala') return NET.publica();
    NET.rival = p.sid;
    S.j[1].nome = limpaNome(p.nome, 'Rival');
    // o elenco do rival vem do servidor (validado lá), nunca do que ele mandou pelo canal
    let el = null;
    for (let i = 0; i < 6 && !el; i++) {
      try { const r = await this.sb.rpc('meu_ult_elenco_partida', { p_partida: this.partida, p_cards: null }); if (r.error) throw r.error; el = r.data && r.data.elenco_guest; }
      catch (e) { console.warn('[ult] elenco do rival:', e); }
      if (!el) await this.pausa(1500);
    }
    if (!el) { NET.aviso = 'O elenco do rival não chegou. A partida foi cancelada.'; await this.abandona(); return render(); }
    S.j[0].elenco = this.elenco.map((x) => ({ ...x }));
    S.j[1].elenco = el.map((x) => this.jogador(x)).filter(Boolean);
    iniciaEscalacao(); mudou();
  },
  chegouEstado() { clearInterval(this.oiTimer); this.ocupado = false; if (S.fase === 'fim') this.reporta(); },
  async reporta() {
    if (this.reportado || !this.partida || !S.jogo) return;
    this.reportado = true;
    try {
      const r = await this.sb.rpc('meu_ult_resultado', { p_partida: this.partida, p_gols_host: S.jogo.ga, p_gols_guest: S.jogo.gb });
      if (r.error) throw r.error;
      this.res = r.data;
      // o segundo a informar fecha a partida; o primeiro confere de novo em alguns segundos
      if (this.res && this.res.estado === 'aguardando_rival') {
        await this.pausa(4000);
        const r2 = await this.sb.rpc('meu_ult_resultado', { p_partida: this.partida, p_gols_host: S.jogo.ga, p_gols_guest: S.jogo.gb });
        if (!r2.error) this.res = r2.data;
      }
    } catch (e) { console.error('[ult] resultado:', e); this.res = { estado: 'erro' }; }
    if (S.fase === 'fim') render();
  },
  resumoFim() {
    const r = this.res;
    const txt = !r ? 'Enviando o resultado…'
      : r.estado === 'finalizada' ? (r.conta_ranking ? (S.jogo.ga === S.jogo.gb ? 'Empate registrado no ranking do mês.' : 'Resultado registrado no ranking do mês.') : 'Partida registrada, sem pontuar no ranking (' + (r.motivo || 'regra anti-farm') + ').')
      : r.estado === 'anulada' ? 'Partida anulada: ' + (r.motivo || 'resultado não confirmado') + '.'
      : r.estado === 'aguardando_rival' ? 'Esperando o rival confirmar o placar.' : 'Não deu para registrar o resultado.';
    return `<div class="pn" style="grid-column:1/-1;text-align:center"><span class="dica">${esc(txt)}</span></div>`;
  },
  async abandona() {
    if (!this.partida || this.saindo || S.fase === 'fim') return;
    this.saindo = true;
    try { const r = await this.sb.rpc('meu_ult_abandona', { p_partida: this.partida }); if (r.error) throw r.error; } catch (e) { console.warn('[ult] abandono:', e); }
    this.saindo = false;
  },
};

/* ---------- início ---------- */
window.addEventListener('beforeunload', () => { if (NET.canal) NET.sair(); if (ULT.on) ULT.abandona(); });
carregar().then(() => (ULT.on ? ULT.inicia() : render())).catch((e) => {
  console.error('[jxj] base:', e);
  pinta('<section class="corpo"><div class="pn"><h3 class="h3">Não consegui carregar a base</h3><p class="dica">Abra o jogo pelo servidor local (servir-2.0.bat), não por duplo clique no arquivo.</p><button type="button" class="sec" onclick="location.href=\'index.html\'">Menu</button></div></section>');
});

</script>
